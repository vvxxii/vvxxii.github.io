<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VVXXII</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #050505;
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Stage 3D visibile e d'impatto */
    .viewport {
      width: 100vw;
      height: 100vh;
      perspective: 650px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: grab;
      overflow: hidden;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .carousel {
      width: 160px;
      height: 75vh;
      position: absolute;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, opacity 0.4s ease, filter 0.4s ease;
    }

    /* Esplosione Glitch Atomica / Particellare */
    .carousel.glitch-explode {
      animation: atomicGlitch 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      pointer-events: none;
    }

    @keyframes atomicGlitch {
      0% {
        filter: invert(0%) contrast(100%);
        transform: scale(1);
      }
      30% {
        filter: invert(100%) contrast(500%) hue-rotate(90deg);
        transform: scale(1.1) rotateZ(2deg) skewX(10deg);
        opacity: 0.9;
      }
      60% {
        filter: contrast(1000%) grayscale(100%) drop-shadow(0 0 15px #fff);
        transform: scale(1.25) translateZ(150px) rotateZ(-3deg);
        opacity: 0.5;
      }
      100% {
        filter: blur(40px) contrast(2000%) grayscale(100%);
        transform: scale(1.6) translateZ(400px);
        opacity: 0;
      }
    }

    /* Singola Faccia del Tamburo (Pulita, no scroll) */
    .sector {
      position: absolute;
      width: 160px;
      height: 70vh;
      top: 0;
      left: 0;
      background: #000;
      backface-visibility: visible;
      /* Sfumatura sottile ai margini per farsi compenetrare */
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      overflow: hidden;
      transition: filter 0.3s ease, opacity 0.3s ease;
      filter: brightness(0.65) contrast(110%) grayscale(40%);
    }

    .sector:hover {
      filter: brightness(1) contrast(100%) grayscale(0%);
    }

    .sector img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Modal Viewer (Scroll Fotografico e Testo) */
    .project-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #050505;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .project-viewer::-webkit-scrollbar { display: none; }

    .project-viewer.active {
      opacity: 1;
      pointer-events: auto;
    }

    .photo-feed {
      max-width: 850px;
      margin: 0 auto;
      padding: 7rem 1.5rem 5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
    }

    .photo-feed img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #1a1a1a;
    }

    .photo-feed p {
      font-size: 0.85rem;
      color: #888;
      line-height: 1.8;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-left: 1px solid #333;
      padding-left: 1.2rem;
    }

    .close-btn {
      position: fixed;
      top: 2rem;
      right: 2rem;
      background: #000;
      border: 1px solid #222;
      color: #666;
      font-family: monospace;
      padding: 0.5rem 1rem;
      cursor: pointer;
      z-index: 210;
      font-size: 0.75rem;
      letter-spacing: 2px;
    }

    .close-btn:hover {
      color: #fff;
      border-color: #555;
    }
  </style>
</head>
<body>

  <div class="viewport" id="viewport">
    <div class="carousel" id="carousel">
      
      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000', 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000'], 'ESTRAZIONE 01 // ARCHIVIO URBAN ED ESPERIMENTI DI LUCE RADENTE.')">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000'], 'ESTRAZIONE 02 // STUDIO SULLO SPAZIO VUOTO.')">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1000', 'https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1000'], 'ESTRAZIONE 03 // GEOMETRIE E ARCHITETTURE MONOLITICHE.')">
        <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000'], 'ESTRAZIONE 04 // SEGNALI VISIVI AD ALTA FREQUENZA.')">
        <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1000'], 'ESTRAZIONE 05 // STRUTTURA E RUMORE FOTOGRAFICO.')">
        <img src="https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000'], 'ESTRAZIONE 06 // TEXTURE MONOCROMATICHE.')">
        <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000'], 'ESTRAZIONE 07 // FRAMMENTI UNICI.')">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000'], 'ESTRAZIONE 08 // SUPERFICIE OSCURA.')">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1000'], 'ESTRAZIONE 09 // PROSPETTIVA.')">
        <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000'], 'ESTRAZIONE 10 // ONDE.')">
        <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000" alt="">
      </div>

    </div>
  </div>

  <div class="project-viewer" id="viewer">
    <button class="close-btn" onclick="closeProject()">[ ESC ]</button>
    <div class="photo-feed" id="photo-feed"></div>
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const sectors = document.querySelectorAll('.sector');
    const totalSectors = sectors.length;
    const angleStep = 360 / totalSectors;
    
    const sectorWidth = 160;
    const radius = Math.round((sectorWidth / 2) / Math.tan(Math.PI / totalSectors)) + 15;

    let currentAngle = 0;
    let isDragging = false;
    let startX = 0;
    let lastAngle = 0;
    let autoRotateSpeed = 0.08;

    sectors.forEach((sector, index) => {
      const angle = index * angleStep;
      sector.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
    });

    function animate() {
      if (!isDragging) {
        currentAngle += autoRotateSpeed;
        updateCarousel();
      }
      requestAnimationFrame(animate);
    }

    function updateCarousel() {
      carousel.style.transform = `translateZ(-${radius}px) rotateY(${currentAngle}deg)`;
    }

    const viewport = document.getElementById('viewport');

    viewport.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      lastAngle = currentAngle;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      currentAngle = lastAngle + deltaX * 0.3;
      updateCarousel();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    viewport.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
      lastAngle = currentAngle;
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      currentAngle = lastAngle + deltaX * 0.3;
      updateCarousel();
    });

    window.addEventListener('touchend', () => { isDragging = false; });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      currentAngle += e.deltaY * 0.08;
      updateCarousel();
    }, { passive: false });

    function openProject(imagesArray, textContent) {
      // Innesca l'animazione di esplosione glitch atomica
      carousel.classList.add('glitch-explode');
      
      const feed = document.getElementById('photo-feed');
      feed.innerHTML = '';
      
      if (textContent) {
        const p = document.createElement('p');
        p.innerText = textContent;
        feed.appendChild(p);
      }

      imagesArray.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        feed.appendChild(img);
      });

      // Apre la vista a scroll dopo l'esplosione
      setTimeout(() => {
        document.getElementById('viewer').classList.add('active');
      }, 380);
    }

    function closeProject() {
      document.getElementById('viewer').classList.remove('active');
      setTimeout(() => {
        carousel.classList.remove('glitch-explode');
      }, 300);
    }

    animate();
  </script>
</body>
</html>
