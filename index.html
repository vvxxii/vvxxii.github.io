<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      cursor: grab;
      transition: opacity 0.8s ease, filter 0.8s ease;
      mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 80%);
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 80%);
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    #webgl-canvas.hidden {
      opacity: 0;
      filter: blur(25px) contrast(300%);
      pointer-events: none;
    }

    .project-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .project-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    .image-scroll-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 1;
    }

    .image-scroll-layer::-webkit-scrollbar { display: none; }

    .image-block {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .image-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65) contrast(135%) grayscale(60%);
    }

    /* COLONNA TESTO: PARTE DAL BORDO SUPERIORE */
    .text-scroll-layer {
      position: absolute;
      top: 0;
      right: 12vw;
      width: 200px;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 2;
      padding-top: 2.5rem; /* Inizia vicino al bordo alto */
      padding-bottom: 10vh;
      pointer-events: auto;
    }

    .text-scroll-layer::-webkit-scrollbar { display: none; }

    .red-text-content {
      color: #b80000;
      font-size: 0.58rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: justify;
      background: transparent;
      text-shadow: 0 0 6px rgba(184, 0, 0, 0.35);
    }

    .close-btn {
      position: fixed;
      top: 2.5rem;
      left: 3rem;
      color: #555;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 4px;
      cursor: pointer;
      z-index: 100;
      background: transparent;
      border: none;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .close-btn:hover {
      color: #b80000;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="project-stage" id="projectStage">
    <button class="close-btn" onclick="closeProject()">[ REGRESS ]</button>

    <div class="image-scroll-layer" id="imageLayer"></div>

    <div class="text-scroll-layer" id="textLayer">
      <div class="red-text-content" id="redText"></div>
    </div>
  </div>

  <script>
    // ARCHIVIO ESTESO CON MOLTE FOTO E TESTO MOLTO LUNGO
    const projects = [
      {
        id: "PROJECT_01",
        text: "REGISTRO DI DECOMPOSIZIONE ESTETICA // Scomposizione organica della materia luminosa. La carne e l'acciaio convergono in un unico punto focale. Nessuna presenza umana rilevata oltre la soglia del silenzio. Architettura priva di gravità apparente, fondata su principi di contrazione ed espansione volumetrica. Ogni sezione fotografica costituisce un reperto esumato da strati geologici sotterranei. Frequenze visive ridotte ai minimi termini per stimolare una percezione pura, viscerale, priva di interferenze esterne. L'oscurità non è assenza di luce, ma presenza densa di materia non riflettente. La sequenza continua a scorrere in modo asincrono rispetto allo spazio circostante, creando una frattura temporale nel flusso dell'interfaccia. Ossidazione visiva e rumore termico registrati lungo i bordi della struttura monolitica. Il vuoto diventa l'unico elemento portante dell'intera composizione visiva. Strati geologici sovrapposti in sequenza asimmetrica. Nessun segnale di ritorno dalla superficie inferiore. Contrazione della massa e alterazione della prospettiva visiva.",
        images: [
          'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600',
          'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1600',
          'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1600',
          'https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1600',
          'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600',
          'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1600'
        ]
      },
      {
        id: "PROJECT_02",
        text: "SPAZIO GEOLOGICO CORRETTO // Infiltrazione di frequenze scure su superfici architettoniche monolitiche. Nessun segnale di ritorno. L'occhio osserva la struttura priva di massa. Sequenze d'ombra calcolate secondo algoritmi di rifrazione minerale. Il corpo reattivo si adatta all'ambiente ostile tramite una serie di trasformazioni anatomiche temporanee. Nessun compromesso stilistico. Tracce visive estrapolate da ambienti sotterranei privi di ossigeno. Il frammento fotografico agisce come documento primario di un evento non documentato. Rilievi ad altissimo contrasto per isolare la forma dalla sua funzione originaria.",
        images: [
          'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600',
          'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1600',
          'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600',
          'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1600'
        ]
      }
    ];

    // SETUP THREE.JS
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5.5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // GENERAZIONE PROCEDURALE NATIIVA DELLE FOTO CON GLITCH SUGLI SPIGOLI
    function createPhotographicGlitchTexture() {
      const texCanvas = document.createElement('canvas');
      texCanvas.width = 1024;
      texCanvas.height = 1024;
      const ctx = texCanvas.getContext('2d');

      // Base scura
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, 1024, 1024);

      // Disegno di forme fotografiche e contrasti anatomico-architetturali
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.moveTo(100, 0); ctx.lineTo(900, 200); ctx.lineTo(800, 1024); ctx.lineTo(0, 800);
      ctx.fill();

      ctx.fillStyle = '#444444';
      ctx.fillRect(200, 150, 600, 300);

      ctx.fillStyle = '#888888';
      ctx.fillRect(350, 200, 300, 500);

      // GLITCH GRAFICO E OSSIDAZIONE SUGLI SPIGOLI
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      for (let i = 0; i < 80; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const w = Math.random() * 250;
        const h = Math.random() * 3;
        ctx.fillRect(x, y, w, h);
      }

      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 150; i++) {
        ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
      }

      return new THREE.CanvasTexture(texCanvas);
    }

    const texture = createPhotographicGlitchTexture();
    const geometry = new THREE.IcosahedronGeometry(1.8, 0);

    // MATERIALE ROUGHNESS BASSA + EFFETTO SPIGOLI INCISI
    const material = new THREE.MeshStandardMaterial({
      map: texture,
      metalness: 0.9,
      roughness: 0.1,
      transparent: true,
      opacity: 0.9,
      flatShading: true // Mantiene e accentua gli spigoli visibili
    });

    const icosahedron = new THREE.Mesh(geometry, material);
    scene.add(icosahedron);

    // SPIGOLI GLITCHATI IN SECONDO LIVELLO
    const wireframeGeo = new THREE.WireframeGeometry(geometry);
    const wireframeMat = new THREE.LineBasicMaterial({ 
      color: 0x666666, 
      transparent: true, 
      opacity: 0.35 
    });
    const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
    icosahedron.add(wireframe);

    // LUCI
    const light1 = new THREE.DirectionalLight(0xffffff, 3.2);
    light1.position.set(5, 5, 5);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0x333333, 1.5);
    light2.position.set(-5, -5, -2);
    scene.add(light2);

    const ambientLight = new THREE.AmbientLight(0x0a0a0a);
    scene.add(ambientLight);

    // DRAG MOUSE / TOUCH
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaMove = {
        x: e.clientX - previousMousePosition.x,
        y: e.clientY - previousMousePosition.y
      };

      icosahedron.rotation.y += deltaMove.x * 0.008;
      icosahedron.rotation.x += deltaMove.y * 0.008;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // INTERAZIONE CLICK SULLE FACCE
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(icosahedron);

      if (intersects.length > 0) {
        const faceIndex = intersects[0].faceIndex;
        const projectIndex = faceIndex % projects.length;
        openProject(projectIndex);
      }
    });

    // ANIMAZIONE ROTAZIONE CON MICRO-GLITCH SUGLI SPIGOLI
    function animate() {
      requestAnimationFrame(animate);

      if (!isDragging) {
        icosahedron.rotation.x += 0.0025;
        icosahedron.rotation.y += 0.0045;
      }

      // Micro-vibrazione glitchata casuale sugli spigoli
      if (Math.random() < 0.04) {
        wireframe.position.x = (Math.random() - 0.5) * 0.03;
      } else {
        wireframe.position.x = 0;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // APERTURA E CHIUSURA PROGETTI
    const projectStage = document.getElementById('projectStage');
    const imageLayer = document.getElementById('imageLayer');
    const redText = document.getElementById('redText');

    function openProject(index) {
      const proj = projects[index];

      imageLayer.innerHTML = '';
      proj.images.forEach(url => {
        const block = document.createElement('div');
        block.className = 'image-block';
        const img = document.createElement('img');
        img.src = url;
        block.appendChild(img);
        imageLayer.appendChild(block);
      });

      redText.innerText = proj.text;

      canvas.classList.add('hidden');
      setTimeout(() => {
        projectStage.classList.add('active');
      }, 400);
    }

    function closeProject() {
      projectStage.classList.remove('active');
      setTimeout(() => {
        canvas.classList.remove('hidden');
      }, 300);
    }
  </script>
</body>
</html>
