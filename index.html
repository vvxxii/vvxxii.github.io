<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII // THE CAGE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      cursor: crosshair;
    }

    body {
      background-color: #020202;
      color: #777;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Tela 3D per la Gabbia */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Contenitore della Materia Fotografia dentro la Gabbia */
    .flesh-container {
      position: absolute;
      width: 280px;
      height: 380px;
      z-index: 2;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s ease-out;
    }

    .flesh-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(250%) grayscale(80%) hue-rotate(320deg) invert(10%) blur(2px);
      mix-blend-mode: screen;
      opacity: 0.85;
      transition: filter 0.5s ease, transform 0.3s ease, opacity 0.5s ease;
      transform: scale(0.9) skewY(2deg);
    }

    /* Stato di Rivelazione (Quando il soggetto viene liberato) */
    body.revealed .flesh-image {
      filter: contrast(100%) grayscale(0%) hue-rotate(0deg) blur(0px);
      mix-blend-mode: normal;
      opacity: 1;
      transform: scale(1) skewY(0deg);
    }

    body.revealed canvas {
      filter: invert(100%) contrast(500%);
      opacity: 0.15;
    }

    /* Testo Ermetico / Sovraimpressione */
    .hermetic-text {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 0.7rem;
      letter-spacing: 4px;
      color: #444;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
      transition: color 0.5s ease;
    }

    body.revealed .hermetic-text {
      color: #aaa;
    }

    /* Contatore di Stato Isolato */
    .index-indicator {
      position: absolute;
      top: 3rem;
      right: 3rem;
      font-size: 0.65rem;
      color: #333;
      letter-spacing: 2px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="index-indicator" id="indicator">SPECIMEN // 01</div>

  <canvas id="cageCanvas"></canvas>

  <div class="flesh-container" id="fleshContainer">
    <img id="fleshImage" class="flesh-image" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000" alt="Organism">
  </div>

  <div class="hermetic-text" id="hermeticText">
    [ TRATTENERE LA MATERIA PER RIVELARE ]
  </div>

  <script>
    // Archivio Frammenti
    const archives = [
      {
        img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000',
        text: 'CORPO N.1 // DEFORMAZIONE DELLA STRUTTURA LUMINOSA'
      },
      {
        img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000',
        text: 'CORPO N.2 // SILENZIO RIGIDO DENTRO LA SPAZIALITÀ'
      },
      {
        img: 'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1000',
        text: 'CORPO N.3 // ISOLAMENTO ARCHITETTONICO'
      },
      {
        img: 'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000',
        text: 'CORPO N.4 // RUMORE OSSIDATO IN AMBIENTE CHIUSO'
      }
    ];

    let currentIndex = 0;
    let isHolding = false;
    let holdTimer = null;

    const fleshImage = document.getElementById('fleshImage');
    const fleshContainer = document.getElementById('fleshContainer');
    const hermeticText = document.getElementById('hermeticText');
    const indicator = document.getElementById('indicator');

    // Setup Canvas 3D per la Gabbia
    const canvas = document.getElementById('cageCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Geometria dei vertici della gabbia prospettica
    let mouseX = 0, mouseY = 0;
    let targetRotX = 0, targetRotY = 0;
    let rotX = 0, rotY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
      mouseY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

      targetRotY = mouseX * 0.5;
      targetRotX = -mouseY * 0.5;

      // Deforma leggermente la carne interna al movimento
      if (!isHolding) {
        const skew = mouseX * 15;
        const scale = 0.85 + Math.abs(mouseY) * 0.1;
        fleshContainer.style.transform = `translate(-50%, -50%) rotateY(${mouseX * 20}deg) skew(${skew}deg) scale(${scale})`;
      }
    });

    // Punti 3D di un cubo/gabbia allungato
    const nodes = [
      [-120, -180, -120], [120, -180, -120], [120, 180, -120], [-120, 180, -120],
      [-120, -180, 120],  [120, -180, 120],  [120, 180, 120],  [-120, 180, 120]
    ];

    const edges = [
      [0,1], [1,2], [2,3], [3,0],
      [4,5], [5,6], [6,7], [7,4],
      [0,4], [1,5], [2,6], [3,7]
    ];

    function project(x, y, z) {
      const fov = 400;
      const scale = fov / (fov + z + 300);
      return {
        x: x * scale + window.innerWidth / 2,
        y: y * scale + window.innerHeight / 2,
        scale: scale
      };
    }

    function drawCage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      rotX += (targetRotX - rotX) * 0.05;
      rotY += (targetRotY - rotY) * 0.05;

      const projected = [];

      nodes.forEach(node => {
        // Rotazione Y
        let x = node[0] * Math.cos(rotY) - node[2] * Math.sin(rotY);
        let z = node[0] * Math.sin(rotY) + node[2] * Math.cos(rotY);
        let y = node[1];

        // Rotazione X
        let y2 = y * Math.cos(rotX) - z * Math.sin(rotX);
        let z2 = y * Math.sin(rotX) + z * Math.cos(rotX);

        projected.push(project(x, y2, z2));
      });

      // Disegna i bordi della gabbia
      ctx.lineWidth = isHolding ? 2 : 0.8;
      ctx.strokeStyle = isHolding ? 'rgba(255, 255, 255, 0.9)' : 'rgba(80, 80, 80, 0.4)';

      edges.forEach(edge => {
        const p1 = projected[edge[0]];
        const p2 = projected[edge[1]];
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      });

      // Posiziona il contenitore fotografico esattamente al centro
      fleshContainer.style.left = `${window.innerWidth / 2}px`;
      fleshContainer.style.top = `${window.innerHeight / 2}px`;

      requestAnimationFrame(drawCage);
    }

    drawCage();

    // Meccanica di Interazione: Pressione / Selezione
    window.addEventListener('mousedown', () => {
      isHolding = true;
      document.body.classList.add('revealed');
      fleshContainer.style.transform = `translate(-50%, -50%) scale(1)`;
      hermeticText.innerText = archives[currentIndex].text;
    });

    window.addEventListener('mouseup', () => {
      isHolding = false;
      document.body.classList.remove('revealed');
      hermeticText.innerText = '[ TRATTENERE LA MATERIA PER RIVELARE ]';
    });

    // Cambio di Specimen (Cambio opera) con Scroll
    window.addEventListener('wheel', (e) => {
      if (e.deltaY > 0) {
        currentIndex = (currentIndex + 1) % archives.length;
      } else {
        currentIndex = (currentIndex - 1 + archives.length) % archives.length;
      }

      // Piccola deformazione durante la transizione
      fleshImage.style.opacity = '0';
      setTimeout(() => {
        fleshImage.src = archives[currentIndex].img;
        indicator.innerText = `SPECIMEN // 0${currentIndex + 1}`;
        fleshImage.style.opacity = '0.85';
      }, 200);
    });
  </script>
</body>
</html>
