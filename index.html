<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #webgl-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 10;
      cursor: crosshair;
      transition: transform 0.9s cubic-bezier(0.7,0,0.3,1), opacity 0.8s ease, filter 0.8s ease;
    }

    #webgl-canvas.morphing {
      transform: scale(4.5);
      filter: blur(15px) contrast(200%);
      opacity: 0;
      pointer-events: none;
    }

    /* lampo di glitch granulare a schermo intero, innescato via JS a intervalli irregolari */
    #webgl-canvas.screen-glitch {
      animation: screenGlitchPop 0.12s steps(2);
    }
    @keyframes screenGlitchPop {
      0%   { clip-path: inset(0 0 0 0); transform: translate(0,0); }
      30%  { clip-path: inset(10% 0 60% 0); transform: translate(-6px,0); }
      55%  { clip-path: inset(55% 0 8% 0); transform: translate(5px,0); }
      80%  { clip-path: inset(2% 0 85% 0); transform: translate(-3px,0); }
      100% { clip-path: inset(0 0 0 0); transform: translate(0,0); }
    }

    /* vignettatura globale + atmosfera dungeon — sopra anche alle pagine progetto */
    #vignette {
      position: fixed; inset: 0;
      z-index: 40;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.42) 78%, rgba(0,0,0,0.88) 100%);
      mix-blend-mode: multiply;
      animation: vignetteGlitch 5s infinite steps(1);
    }
    @keyframes vignetteGlitch {
      0%, 100% { opacity: 1; }
      41% { opacity: 1; }
      42% { opacity: 0.6; }
      43% { opacity: 1; }
      77% { opacity: 1; }
      78% { opacity: 0.75; transform: translateX(3px); }
      79% { opacity: 1; transform: translateX(0); }
    }

    /* grana pellicola / rumore che flickera, granulare e veloce — anche sopra le pagine progetto */
    #grain {
      position: fixed; inset: 0;
      z-index: 41;
      pointer-events: none;
      opacity: 0.07;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      animation: grainShift 0.15s steps(2) infinite;
    }
    @keyframes grainShift {
      0% { transform: translate(0,0); }
      50% { transform: translate(-3%,2%); }
      100% { transform: translate(2%,-3%); }
    }

    .project-stage {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.3s;
      background: #000;
    }
    .project-stage.active { opacity: 1; pointer-events: auto; }

    .image-scroll-layer {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 1;
    }
    .image-scroll-layer::-webkit-scrollbar { display: none; }

    .image-block { width: 100vw; height: 100vh; position: relative; }

    .image-block img {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.5) contrast(140%) grayscale(70%) sepia(20%);
      opacity: 0.88;
    }

    .image-block::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
    }

    .text-scroll-layer {
      position: absolute; top: 0; right: 10vw;
      width: 200px; height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 2;
      padding-top: 2.5rem;
      padding-bottom: 20vh;
      pointer-events: auto;
    }
    .text-scroll-layer::-webkit-scrollbar { display: none; }

    .red-text-content {
      color: #b80000;
      font-size: 0.58rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: justify;
      background: transparent;
      text-shadow: 0 0 6px rgba(184,0,0,0.35);
      animation: textGlitch 2.6s infinite steps(1);
      will-change: transform, clip-path;
    }
    @keyframes textGlitch {
      0%   { transform: translate(0,0); clip-path: inset(0 0 0 0); text-shadow: 0 0 6px rgba(184,0,0,0.35); }
      4%   { transform: translate(-1px,0); clip-path: inset(0 0 0 0); text-shadow: 2px 0 rgba(0,200,200,0.4), -2px 0 rgba(184,0,0,0.6); }
      6%   { transform: translate(1px,0); clip-path: inset(20% 0 30% 0); text-shadow: -3px 0 rgba(0,200,200,0.5), 3px 0 rgba(184,0,0,0.7); }
      8%   { transform: translate(0,0); clip-path: inset(0 0 0 0); text-shadow: 0 0 6px rgba(184,0,0,0.35); }
      33%  { transform: translate(0,0); clip-path: inset(0 0 0 0); text-shadow: 0 0 6px rgba(184,0,0,0.35); }
      34%  { transform: translate(2px,0); clip-path: inset(45% 0 5% 0); text-shadow: -2px 0 rgba(0,180,180,0.55), 2px 0 rgba(184,0,0,0.75); }
      35%  { transform: translate(-2px,0); clip-path: inset(5% 0 60% 0); text-shadow: 3px 0 rgba(0,180,180,0.5), -3px 0 rgba(184,0,0,0.7); }
      37%  { transform: translate(0,0); clip-path: inset(0 0 0 0); text-shadow: 0 0 6px rgba(184,0,0,0.35); }
      70%  { transform: translate(0,0); clip-path: inset(0 0 0 0); text-shadow: 0 0 6px rgba(184,0,0,0.35); }
      71%  { transform: translate(-1px,0); clip-path: inset(70% 0 2% 0); text-shadow: 2px 0 rgba(0,200,200,0.45), -2px 0 rgba(184,0,0,0.65); }
      73%  { transform: translate(1px,0); clip-path: inset(2% 0 75% 0); text-shadow: -2px 0 rgba(0,200,200,0.45), 2px 0 rgba(184,0,0,0.65); }
      75%  { transform: translate(0,0); clip-path: inset(0 0 0 0); text-shadow: 0 0 6px rgba(184,0,0,0.35); }
      100% { transform: translate(0,0); clip-path: inset(0 0 0 0); text-shadow: 0 0 6px rgba(184,0,0,0.35); }
    }

    .close-btn {
      position: fixed; top: 2.5rem; left: 3rem;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem; line-height: 1;
      cursor: pointer; z-index: 100;
      background: transparent; border: none;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .close-btn:hover { color: #b80000; transform: scale(1.2); }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>

  <div class="project-stage" id="projectStage">
    <button class="close-btn" onclick="closeProject()">✕</button>
    <div class="image-scroll-layer" id="imageLayer"></div>
    <div class="text-scroll-layer" id="textLayer">
      <div class="red-text-content" id="redText"></div>
    </div>
  </div>

  <script>
    const projects = [
      {
        id: "PROJECT_01",
        text: "REGISTRO DI DECOMPOSIZIONE ESTETICA // Scomposizione organica della materia luminosa. La carne e l'acciaio convergono in un unico punto focale. Nessuna presenza umana rilevata oltre la soglia del silenzio. Architettura priva di gravità apparente, fondata su principi di contrazione ed espansione volumetrica. Ogni sezione fotografica costituisce un reperto esumato da strati geologici sotterranei. Frequenze visive ridotte ai minimi termini per stimolare una percezione pura, viscerale, priva di interferenze esterne. L'oscurità non è assenza di luce, ma presenza densa di materia non riflettente.",
        images: [
          'https://picsum.photos/id/1025/1600/1000',
          'https://picsum.photos/id/1040/1600/1000',
          'https://picsum.photos/id/1062/1600/1000',
          'https://picsum.photos/id/1069/1600/1000'
        ]
      },
      {
        id: "PROJECT_02",
        text: "SPAZIO GEOLOGICO CORRETTO // Infiltrazione di frequenze scure su superfici architettoniche monolitiche. Nessun segnale di ritorno. L'occhio osserva la struttura priva di massa. Sequenze d'ombra calcolate secondo algoritmi di rifrazione minerale. Il corpo reattivo si adatta all'ambiente ostile tramite una serie di trasformazioni anatomiche temporanee.",
        images: [
          'https://picsum.photos/id/1050/1600/1000',
          'https://picsum.photos/id/1060/1600/1000'
        ]
      }
    ];

    // immagini usate come "pelle" del blob (mosaico triplanare bn / colore)
    const skinPool = [
      'https://picsum.photos/id/1025/500/500','https://picsum.photos/id/1040/500/500',
      'https://picsum.photos/id/1062/500/500','https://picsum.photos/id/1050/500/500',
      'https://picsum.photos/id/1060/500/500','https://picsum.photos/id/1069/500/500'
    ];

    const LOBE_COUNT = 6;

    function loadImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    // mosaico usato per la texture triplanare: bn sempre presente, colore che
    // emerge solo nell'alone del lobo in evidenza
    async function buildMosaic(urls, mode) {
      const size = 1024, cols = 3, rows = 2;
      const cw = size / cols, ch = size / rows;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, size, size);

      for (let i = 0; i < urls.length; i++) {
        const img = await loadImage(urls[i]);
        if (!img) continue;
        const cx = (i % cols) * cw, cy = Math.floor(i / cols) * ch;
        ctx.save();
        ctx.beginPath();
        ctx.rect(cx, cy, cw, ch);
        ctx.clip();
        ctx.filter = mode === 'bw'
          ? 'grayscale(100%) contrast(122%) brightness(0.62)'
          : 'saturate(230%) contrast(116%) brightness(0.9)';
        const scale = Math.max(cw / img.width, ch / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, cx - (w - cw) / 2, cy - (h - ch) / 2, w, h);
        ctx.restore();
      }
      ctx.filter = 'none';

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.needsUpdate = true;
      return tex;
    }

    // GLSL — fullscreen raymarch: un unico "organismo" scolpito da SDF,
    // nessun poligono: le facce nette diventano lobi organici fusi tra loro
    const VERT = `
      void main() {
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const FRAG = `
      precision highp float;
      #define LOBE_COUNT ${LOBE_COUNT}
      #define MAX_STEPS 90
      #define MAX_DIST 20.0
      #define SURF_DIST 0.0015

      uniform vec2  uResolution;
      uniform float uTime;
      uniform vec3  uCamPos;
      uniform vec3  uCamRight;
      uniform vec3  uCamUp;
      uniform vec3  uCamForward;
      uniform float uTanFov;
      uniform mat3  uInvRot;
      uniform vec3  uLobePos[LOBE_COUNT];
      uniform float uLobeRadius[LOBE_COUNT];
      uniform float uLobeGlow[LOBE_COUNT];
      uniform float uLobePhase[LOBE_COUNT];
      uniform float uGlitch;
      uniform sampler2D uAlbedoTex;
      uniform sampler2D uColorTex;

      float hash13(vec3 p) {
        p = fract(p * 0.3183099 + 0.1);
        p *= 17.0;
        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
      }

      float vnoise(vec3 p) {
        vec3 i = floor(p);
        vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float n000 = hash13(i + vec3(0.0,0.0,0.0));
        float n100 = hash13(i + vec3(1.0,0.0,0.0));
        float n010 = hash13(i + vec3(0.0,1.0,0.0));
        float n110 = hash13(i + vec3(1.0,1.0,0.0));
        float n001 = hash13(i + vec3(0.0,0.0,1.0));
        float n101 = hash13(i + vec3(1.0,0.0,1.0));
        float n011 = hash13(i + vec3(0.0,1.0,1.0));
        float n111 = hash13(i + vec3(1.0,1.0,1.0));
        return mix(
          mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),
          mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y),
          f.z
        );
      }

      float fbm(vec3 p) {
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * vnoise(p);
          p *= 2.02;
          a *= 0.5;
        }
        return v;
      }

      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      float sdSphere(vec3 p, vec3 c, float r) {
        return length(p - c) - r;
      }

      float sceneSDF(vec3 p, out float glowAmt) {
        vec3 op = uInvRot * p;

        float breathe = 0.05 * sin(uTime * 0.8);
        float d = sdSphere(op, vec3(0.0), 0.95 + breathe * 0.3);
        glowAmt = 0.0;

        for (int i = 0; i < LOBE_COUNT; i++) {
          float pulse = 0.06 * sin(uTime * 1.3 + uLobePhase[i]);
          float r = uLobeRadius[i] + pulse + uLobeGlow[i] * 0.07;
          float ds = sdSphere(op, uLobePos[i], r);
          d = smin(d, ds, 0.45);

          float dist = length(op - uLobePos[i]);
          float sigma = uLobeRadius[i] * 1.6;
          glowAmt += uLobeGlow[i] * exp(-(dist * dist) / (2.0 * sigma * sigma));
        }

        float wrinkle = fbm(op * 3.2 + uTime * 0.05) - 0.5;
        d += wrinkle * 0.05;

        float glitchNoise = fbm(op * 9.0 + uTime * 6.0);
        d -= step(0.82, glitchNoise) * uGlitch * 0.14;

        return d;
      }

      vec3 calcNormal(vec3 p) {
        vec2 e = vec2(0.0015, 0.0);
        float g;
        return normalize(vec3(
          sceneSDF(p + e.xyy, g) - sceneSDF(p - e.xyy, g),
          sceneSDF(p + e.yxy, g) - sceneSDF(p - e.yxy, g),
          sceneSDF(p + e.yyx, g) - sceneSDF(p - e.yyx, g)
        ));
      }

      vec3 triplanar(sampler2D tex, vec3 p, vec3 n) {
        vec3 an = abs(n);
        an /= (an.x + an.y + an.z + 0.0001);
        vec3 cx = texture2D(tex, p.yz * 0.5 + 0.5).rgb;
        vec3 cy = texture2D(tex, p.xz * 0.5 + 0.5).rgb;
        vec3 cz = texture2D(tex, p.xy * 0.5 + 0.5).rgb;
        return cx * an.x + cy * an.y + cz * an.z;
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy / uResolution - 0.5) * 2.0;
        uv.x *= uResolution.x / uResolution.y;

        // corruzione a blocchi: la direzione del raggio "salta" a blocchi discreti,
        // dà l'effetto insetto/digitale corrotto quando uGlitch è alto
        vec2 blockUv = floor(gl_FragCoord.xy / 9.0);
        float blockN = hash13(vec3(blockUv, floor(uTime * 30.0)));
        vec2 jitter = (blockN > 0.85)
          ? (vec2(hash13(vec3(blockUv,1.0)), hash13(vec3(blockUv,2.0))) - 0.5) * uGlitch * 0.05
          : vec2(0.0);

        vec3 rd = normalize(uCamForward + (uv.x + jitter.x) * uTanFov * uCamRight + (uv.y + jitter.y) * uTanFov * uCamUp);
        vec3 ro = uCamPos;

        float t = 0.0;
        float glow = 0.0;
        bool hit = false;
        int steps = 0;
        vec3 p = ro;

        for (int i = 0; i < MAX_STEPS; i++) {
          p = ro + rd * t;
          float g;
          float d = sceneSDF(p, g);
          steps = i;
          if (d < SURF_DIST) { hit = true; glow = g; break; }
          t += d;
          if (t > MAX_DIST) break;
        }

        vec3 col = vec3(0.0);

        if (hit) {
          vec3 n = calcNormal(p);
          vec3 op = uInvRot * p;

          vec3 lightPos = vec3(2.2, 1.6, 3.2);
          vec3 lightDir = normalize(lightPos - p);
          float diff = max(dot(n, lightDir), 0.0);

          vec3 rimDir = normalize(vec3(-3.0, -1.5, -2.0) - p);
          float rim = max(dot(n, rimDir), 0.0);

          float fres = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);

          vec3 albedoBW = triplanar(uAlbedoTex, op, n);
          vec3 albedoColor = triplanar(uColorTex, op, n);
          vec3 albedo = mix(albedoBW, albedoColor, clamp(glow, 0.0, 1.0));

          vec3 warm = vec3(1.0, 0.34, 0.12);
          vec3 cool = vec3(0.10, 0.05, 0.20);

          col = albedo * (0.08 + diff * 0.9) * warm;
          col += albedo * rim * 0.22 * cool;
          col += fres * warm * 0.3;
          col += warm * glow * 1.3;

          float fog = 1.0 - exp(-t * 0.11);
          col = mix(col, vec3(0.0), fog);

          col *= 0.65 + 0.35 * (1.0 - float(steps) / float(MAX_STEPS));
        }

        col.r += hash13(vec3(gl_FragCoord.xy * 0.7, uTime * 30.0)) * uGlitch * 0.12;
        col.b -= hash13(vec3(gl_FragCoord.xy * 0.9, uTime * 31.0)) * uGlitch * 0.08;

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    (async function init() {
      const canvas = document.getElementById('webgl-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      // camera "virtuale" (solo matematica, non renderizza): fissa, il movimento
      // lo dà la rotazione del blob stesso
      const camPos = new THREE.Vector3(0, 0, 5.5);
      const camForward = new THREE.Vector3(0, 0, -1);
      const camRight = new THREE.Vector3(1, 0, 0);
      const camUp = new THREE.Vector3(0, 1, 0);
      const FOV = THREE.MathUtils.degToRad(45);
      const tanFov = Math.tan(FOV / 2);

      // lobi distribuiti su una sfera (fibonacci sphere), ognuno legato a un progetto
      const lobes = [];
      for (let i = 0; i < LOBE_COUNT; i++) {
        const y = 1 - (i / (LOBE_COUNT - 1)) * 2;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = Math.PI * (3 - Math.sqrt(5)) * i;
        const pos = new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r).multiplyScalar(1.05);
        lobes.push({
          local: pos,
          radius: 0.4 + Math.random() * 0.12,
          project: i % projects.length,
          phase: Math.random() * Math.PI * 2,
          glow: 0
        });
      }

      const [bwTex, colorTex] = await Promise.all([
        buildMosaic(skinPool, 'bw'),
        buildMosaic(skinPool, 'color')
      ]);

      const uniforms = {
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uTime: { value: 0 },
        uCamPos: { value: camPos },
        uCamRight: { value: camRight },
        uCamUp: { value: camUp },
        uCamForward: { value: camForward },
        uTanFov: { value: tanFov },
        uInvRot: { value: new THREE.Matrix3() },
        uLobePos: { value: lobes.map(l => l.local) },
        uLobeRadius: { value: lobes.map(l => l.radius) },
        uLobeGlow: { value: lobes.map(() => 0) },
        uLobePhase: { value: lobes.map(l => l.phase) },
        uGlitch: { value: 0 },
        uAlbedoTex: { value: bwTex },
        uColorTex: { value: colorTex }
      };

      const material = new THREE.ShaderMaterial({
        vertexShader: VERT,
        fragmentShader: FRAG,
        uniforms
      });
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
      scene.add(quad);

      // ROTAZIONE via drag/hover, inerzia, più idle spin — stesso feeling di prima
      let yaw = 0, pitch = 0;
      let velYaw = 0, velPitch = 0;
      let isDragHover = false;
      let prevX = 0, prevY = 0;
      let invRot = new THREE.Matrix3();

      function updateRotation(dt) {
        if (isDragHover) {
          yaw += velYaw;
          pitch += velPitch;
        } else {
          velYaw *= 0.95;
          velPitch *= 0.95;
          yaw += velYaw + 0.15 * dt;
          pitch += velPitch + 0.07 * dt;
        }
        const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yaw);
        const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), pitch);
        const q = qYaw.multiply(qPitch);
        const M4 = new THREE.Matrix4().makeRotationFromQuaternion(q);
        const M3 = new THREE.Matrix3().setFromMatrix4(M4);
        invRot.copy(M3).transpose();
        uniforms.uInvRot.value.copy(invRot);
      }

      // ray dal mouse verso il mondo (camera fissa) — usato per hover/click sui lobi
      function rayFromMouse(clientX, clientY) {
        let ux = (clientX / window.innerWidth - 0.5) * 2.0;
        let uy = -(clientY / window.innerHeight - 0.5) * 2.0;
        ux *= window.innerWidth / window.innerHeight;
        const dir = camForward.clone()
          .add(camRight.clone().multiplyScalar(ux * tanFov))
          .add(camUp.clone().multiplyScalar(uy * tanFov))
          .normalize();
        return dir;
      }

      // test raggio-sfera in object space (dopo aver applicato invRot), per capire
      // se il mouse è sopra il "corpo" del blob o su un lobo preciso
      function raySphereHit(ro, rd, center, radius) {
        const oc = ro.clone().sub(center);
        const b = oc.dot(rd);
        const c = oc.dot(oc) - radius * radius;
        const disc = b * b - c;
        if (disc < 0) return Infinity;
        const t = -b - Math.sqrt(disc);
        return t > 0 ? t : Infinity;
      }

      let hoveredLobe = -1;

      function pickLobe(clientX, clientY) {
        const rd = rayFromMouse(clientX, clientY);
        const roObj = camPos.clone().applyMatrix3(invRot);
        const rdObj = rd.clone().applyMatrix3(invRot);

        // corpo del blob: raggio d'ingombro ~1.9
        const bodyT = raySphereHit(roObj, rdObj, new THREE.Vector3(0,0,0), 1.9);
        isDragHover = isFinite(bodyT);

        let best = -1, bestT = Infinity;
        lobes.forEach((l, i) => {
          const t = raySphereHit(roObj, rdObj, l.local, l.radius * 1.15);
          if (t < bestT) { bestT = t; best = i; }
        });
        return best;
      }

      window.addEventListener('mousemove', (e) => {
        const wasHover = isDragHover;
        hoveredLobe = pickLobe(e.clientX, e.clientY);
        if (isDragHover) {
          if (wasHover) {
            velYaw = (e.clientX - prevX) * 0.004;
            velPitch = (e.clientY - prevY) * 0.004;
          }
          prevX = e.clientX; prevY = e.clientY;
        } else {
          hoveredLobe = -1;
        }
      });

      window.addEventListener('click', (e) => {
        const idx = pickLobe(e.clientX, e.clientY);
        if (idx >= 0 && isDragHover) {
          const projectIndex = lobes[idx].project;
          canvas.classList.add('morphing');
          setTimeout(() => openProject(projectIndex), 700);
        }
      });

      // GLITCH: ambiente costante e leggero + convulsioni brevi e irregolari
      let glitchLevel = 0.12;
      let glitchClock = 0, nextGlitchAt = 0.3;
      function updateGlitch(dt) {
        glitchClock += dt;
        glitchLevel = Math.max(0.12, glitchLevel - dt * 3.0);
        if (glitchClock >= nextGlitchAt) {
          glitchClock = 0;
          nextGlitchAt = 0.15 + Math.random() * 0.6;
          glitchLevel = 0.5 + Math.random() * 0.5;
          if (Math.random() < 0.3) {
            canvas.classList.remove('screen-glitch');
            void canvas.offsetWidth;
            canvas.classList.add('screen-glitch');
          }
        }
        uniforms.uGlitch.value = glitchLevel;
      }

      const RISE_RATE = 9.0;
      const FALL_RATE = 2.0;

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        uniforms.uTime.value = clock.elapsedTime;

        updateRotation(dt);
        updateGlitch(dt);

        for (let i = 0; i < LOBE_COUNT; i++) {
          const target = (hoveredLobe === i) ? 1 : 0;
          const rate = target > lobes[i].glow ? RISE_RATE : FALL_RATE;
          lobes[i].glow += (target - lobes[i].glow) * Math.min(1, rate * dt);
          uniforms.uLobeGlow.value[i] = lobes[i].glow;
        }

        renderer.render(scene, orthoCam);
      }
      animate();

      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
      });
    })();

    // APERTURA / CHIUSURA STAGE
    const projectStage = document.getElementById('projectStage');
    const imageLayer = document.getElementById('imageLayer');
    const redText = document.getElementById('redText');
    const canvasEl = document.getElementById('webgl-canvas');

    function openProject(index) {
      const proj = projects[index];
      imageLayer.innerHTML = '';
      proj.images.forEach(url => {
        const block = document.createElement('div');
        block.className = 'image-block';
        const img = document.createElement('img');
        img.src = url;
        block.appendChild(img);
        imageLayer.appendChild(block);
      });
      redText.innerText = proj.text;
      projectStage.classList.add('active');
    }

    function closeProject() {
      projectStage.classList.remove('active');
      setTimeout(() => canvasEl.classList.remove('morphing'), 400);
    }
  </script>
</body>
</html>
