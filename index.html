<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII // EDITORIAL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030303;
      color: #888;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* AREA CENTRALE MAIN (Foto a tutta pagina + Scroll dei dettagli) */
    .main-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(100vw - 90px);
      height: 100vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      z-index: 1;
    }

    .main-feed::-webkit-scrollbar {
      display: none;
    }

    /* Sezione Hero (Prima Foto a tutto schermo) */
    .hero-section {
      width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 4rem;
    }

    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65) contrast(130%) grayscale(60%);
      z-index: -1;
      transition: filter 0.6s ease;
    }

    .hero-bg:hover {
      filter: brightness(0.85) contrast(110%) grayscale(0%);
    }

    .hero-title {
      color: #fff;
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.7);
      padding: 0.8rem 1.5rem;
      border-left: 2px solid #555;
    }

    /* Contenuto interno al progetto che emerge durante lo scroll */
    .project-body {
      padding: 8rem 4rem 12rem 4rem;
      background: #030303;
      display: flex;
      flex-direction: column;
      gap: 6rem;
      max-width: 1100px;
    }

    .editorial-block {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .editorial-block img {
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: cover;
      border: 1px solid #151515;
      filter: brightness(0.8) contrast(120%);
    }

    .editorial-text {
      font-size: 0.8rem;
      line-height: 1.8;
      color: #777;
      letter-spacing: 1px;
      text-transform: uppercase;
      max-width: 650px;
      border-left: 1px solid #222;
      padding-left: 1.5rem;
    }

    /* STRISCIA LATERALE A DESTRA (Thumbnails) */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 90px;
      height: 100vh;
      background: #000;
      border-left: 1px solid #111;
      z-index: 100;
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 0;
      gap: 1.2rem;
    }

    .sidebar::-webkit-scrollbar {
      display: none;
    }

    .thumb-item {
      width: 60px;
      height: 85px;
      position: relative;
      cursor: pointer;
      opacity: 0.35;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      flex-shrink: 0;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
    }

    .thumb-item:hover {
      opacity: 0.8;
    }

    .thumb-item.active {
      opacity: 1;
      border-color: #666;
    }

    .thumb-item.active img {
      filter: grayscale(0%);
    }

    .thumb-label {
      position: absolute;
      bottom: -1.2rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.5rem;
      color: #444;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- AREA PRINCIPALE (A Sinistra) -->
  <main class="main-feed" id="mainFeed">
    
    <!-- Immagine di copertina a tutto schermo -->
    <section class="hero-section">
      <img id="heroBg" class="hero-bg" src="" alt="Cover">
      <div class="hero-title" id="heroTitle"></div>
    </section>

    <!-- Contenuto dettagliato a scorrimento -->
    <section class="project-body" id="projectBody">
      <!-- Il contenuto visivo ed ermetico viene inserito dinamicamente -->
    </section>

  </main>

  <!-- COLONNA THUMBNAIL (A Destra) -->
  <aside class="sidebar" id="sidebar">
    <!-- Generata da JavaScript -->
  </aside>

  <script>
    // Archivio Progetti
    const projects = [
      {
        id: 'SEC_01',
        title: 'ESTRAZIONE 01 // TORSIONE E MATERIA LUMINOSA',
        cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200',
        content: [
          {
            type: 'text',
            value: 'Studio viscerale della luce radente su superfici industriali scomposizioni e ombre profonde.'
          },
          {
            type: 'image',
            value: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1200'
          },
          {
            type: 'text',
            value: 'Assenza di colore primario. Dominanza dei grigi ossidati e saturazione controllata.'
          },
          {
            type: 'image',
            value: 'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1200'
          }
        ]
      },
      {
        id: 'SEC_02',
        title: 'ESTRAZIONE 02 // SPAZIO ISOLATO E SILENZIO',
        cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200',
        content: [
          {
            type: 'text',
            value: 'Rilievi su geometrie architettoniche deserte e superfici prive di presenza umana.'
          },
          {
            type: 'image',
            value: 'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1200'
          }
        ]
      },
      {
        id: 'SEC_03',
        title: 'ESTRAZIONE 03 // MONOLITI E MONOCROMO',
        cover: 'https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1200',
        content: [
          {
            type: 'image',
            value: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200'
          },
          {
            type: 'text',
            value: 'Frequenze visive ridotte all’essenziale. Strutture portanti svelate dal buio.'
          }
        ]
      },
      {
        id: 'SEC_04',
        title: 'ESTRAZIONE 04 // NOISE E RUMORE FOTOGRAFICO',
        cover: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1200',
        content: [
          {
            type: 'text',
            value: 'Grana spessa ed esposizioni estreme su pellicola chimica.'
          },
          {
            type: 'image',
            value: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200'
          }
        ]
      }
    ];

    let activeProjectIndex = 0;

    const mainFeed = document.getElementById('mainFeed');
    const heroBg = document.getElementById('heroBg');
    const heroTitle = document.getElementById('heroTitle');
    const projectBody = document.getElementById('projectBody');
    const sidebar = document.getElementById('sidebar');

    // Inizializza la colonna laterale con le miniature
    function initSidebar() {
      sidebar.innerHTML = '';
      projects.forEach((proj, idx) => {
        const item = document.createElement('div');
        item.className = `thumb-item ${idx === activeProjectIndex ? 'active' : ''}`;
        item.onclick = () => selectProject(idx);

        const img = document.createElement('img');
        img.src = proj.cover;

        const label = document.createElement('span');
        label.className = 'thumb-label';
        label.innerText = proj.id;

        item.appendChild(img);
        item.appendChild(label);
        sidebar.appendChild(item);
      });
    }

    // Carica il progetto selezionato
    function selectProject(index) {
      activeProjectIndex = index;
      const proj = projects[index];

      // Aggiorna Sidebar
      initSidebar();

      // Transizione fluida della copertina
      heroBg.style.opacity = '0';
      setTimeout(() => {
        heroBg.src = proj.cover;
        heroTitle.innerText = proj.title;
        heroBg.style.opacity = '1';
      }, 200);

      // Svuota e riempie il corpo del progetto
      projectBody.innerHTML = '';
      proj.content.forEach(item => {
        const block = document.createElement('div');
        block.className = 'editorial-block';

        if (item.type === 'text') {
          const p = document.createElement('p');
          p.className = 'editorial-text';
          p.innerText = item.value;
          block.appendChild(p);
        } else if (item.type === 'image') {
          const img = document.createElement('img');
          img.src = item.value;
          block.appendChild(img);
        }

        projectBody.appendChild(block);
      });

      // Riporta lo scroll in cima
      mainFeed.scrollTop = 0;
    }

    // Avvio
    selectProject(0);
  </script>
</body>
</html>
