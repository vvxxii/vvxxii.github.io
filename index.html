<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* CANVAS 3D CON MORPHING SCALE */
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      cursor: crosshair;
      transition: transform 0.9s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.8s ease, filter 0.8s ease;
    }

    /* EFFETTO MORPHING EXPAND */
    #webgl-canvas.morphing {
      transform: scale(4.5);
      filter: blur(15px) contrast(200%);
      opacity: 0;
      pointer-events: none;
    }

    .project-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.3s;
    }

    .project-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    .image-scroll-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 1;
    }

    .image-scroll-layer::-webkit-scrollbar { display: none; }

    .image-block {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .image-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65) contrast(135%) grayscale(60%);
    }

    /* COLONNA TESTO TRIPLICATA, PARTE DALL'ALTO A DESTRA */
    .text-scroll-layer {
      position: absolute;
      top: 0;
      right: 10vw;
      width: 200px;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 2;
      padding-top: 2.5rem;
      padding-bottom: 20vh;
      pointer-events: auto;
    }

    .text-scroll-layer::-webkit-scrollbar { display: none; }

    .red-text-content {
      color: #b80000;
      font-size: 0.58rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: justify;
      background: transparent;
      text-shadow: 0 0 6px rgba(184, 0, 0, 0.35);
    }

    .close-btn {
      position: fixed;
      top: 2.5rem;
      left: 3rem;
      color: #555;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 4px;
      cursor: pointer;
      z-index: 100;
      background: transparent;
      border: none;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .close-btn:hover {
      color: #b80000;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="project-stage" id="projectStage">
    <button class="close-btn" onclick="closeProject()">[ REGRESS ]</button>

    <div class="image-scroll-layer" id="imageLayer"></div>

    <div class="text-scroll-layer" id="textLayer">
      <div class="red-text-content" id="redText"></div>
    </div>
  </div>

  <script>
    // ARCHIVIO CON TESTO TRIPLICATO IN LUNGHEZZA
    const projects = [
      {
        id: "PROJECT_01",
        text: "REGISTRO DI DECOMPOSIZIONE ESTETICA // Scomposizione organica della materia luminosa. La carne e l'acciaio convergono in un unico punto focale. Nessuna presenza umana rilevata oltre la soglia del silenzio. Architettura priva di gravità apparente, fondata su principi di contrazione ed espansione volumetrica. Ogni sezione fotografica costituisce un reperto esumato da strati geologici sotterranei. Frequenze visive ridotte ai minimi termini per stimolare una percezione pura, viscerale, priva di interferenze esterne. L'oscurità non è assenza di luce, ma presenza densa di materia non riflettente. La sequenza continua a scorrere in modo asincrono rispetto allo spazio circostante, creando una frattura temporale nel flusso dell'interfaccia. Ossidazione visiva e rumore termico registrati lungo i bordi della struttura monolitica. Il vuoto diventa l'unico elemento portante dell'intera composizione visiva. Strati geologici sovrapposti in sequenza asimmetrica. Nessun segnale di ritorno dalla superficie inferiore. Contrazione della massa e alterazione della prospettiva visiva. ANALISI STRUTTURALE // Il frammento fotografico agisce come documento primario di un evento non documentato. Rilievi ad altissimo contrasto per isolare la forma dalla sua funzione originaria. Silenzio operativo prolungato nelle sezioni inferiori del monolite. Interfeze ottiche sovrapposte lungo l'asse di propagazione visiva. Nessun margine di tolleranza visiva. Frequenza di campionamento ridotta a livelli critici per preservare la materia grezza dell'immagine. Sequenza sotterranea in stato di alterazione progressiva. Infrasuoni registrati a bassa frequenza durante la fase di esposizione. La luce penetra come un'incisione meccanica sulla pellicola chimica arida. Nessun contorno definito. La superficie assorbe e riflette l'ombra in un unico blocco cromatico omogeneo. ESPANSIONE PARAGRAFO // La densità visiva aumenta progressivamente all'aumentare della profondità di scroll. Nessuna interruzione nella continuità della materia fotografica. La struttura rigida cede il passo a una sequenza liquida di particelle scure e surfaces ossidate. Ogni transizione visiva è calcolata per mantenere la coerenza con l'ambiente ostile circostante.",
        images: [
          'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600',
          'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1600',
          'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1600',
          'https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1600',
          'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600',
          'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1600'
        ]
      },
      {
        id: "PROJECT_02",
        text: "SPAZIO GEOLOGICO CORRETTO // Infiltrazione di frequenze scure su superfici architettoniche monolitiche. Nessun segnale di ritorno. L'occhio osserva la struttura priva di massa. Sequenze d'ombra calcolate secondo algoritmi di rifrazione minerale. Il corpo reattivo si adatta all'ambiente ostile tramite una serie di trasformazioni anatomiche temporanee. Nessun compromesso stilistico. Tracce visive estrapolate da ambienti sotterranei privi di ossigeno. Rilievi ad altissimo contrasto per isolare la forma dalla sua funzione originaria. OSSERVAZIONI SULLA MATERIA // La superficie non presenta discontinuità apparenti. La grana chimica si fonde con la griglia digitale creando un pattern irrepetibile di rumore visivo. Tracce di corrosione visibile sui bordi laterali del blocco visivo. La colonna di testo scorre in sovrapposizione mantenendo un contrasto cromatico isolato in rosso sanguigno.",
        images: [
          'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600',
          'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1600',
          'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600',
          'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1600'
        ]
      }
    ];

    // SETUP THREE.JS
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5.5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // GENERAZIONE MAPPA FOTOGRAFICA/TEXTURE GARANTITA SENZA BLOCCHI
    function createTexture() {
      const texCanvas = document.createElement('canvas');
      texCanvas.width = 512;
      texCanvas.height = 512;
      const ctx = texCanvas.getContext('2d');

      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, 512, 512);

      // Pattern sgranato e geometrico
      ctx.fillStyle = '#333';
      ctx.fillRect(50, 50, 412, 412);
      ctx.fillStyle = '#777';
      ctx.fillRect(120, 120, 272, 272);
      ctx.fillStyle = '#aaa';
      ctx.fillRect(180, 180, 152, 152);

      // Rumore visivo sugli spigoli
      ctx.fillStyle = '#000';
      for (let i = 0; i < 1200; i++) {
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
      }

      return new THREE.CanvasTexture(texCanvas);
    }

    const texture = createTexture();
    const geometry = new THREE.IcosahedronGeometry(1.8, 0);

    // MATERIALE OPACO, CORROSO, ZERO LUCIDO
    const material = new THREE.MeshBasicMaterial({
      map: texture,
      wireframe: false
    });

    const icosahedron = new THREE.Mesh(geometry, material);
    scene.add(icosahedron);

    // MOVIMENTO AUTONOMO + TRACCIAMENTO MOUSE
    let targetRotationX = 0;
    let targetRotationY = 0;
    let mouseX = 0;
    let mouseY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // INTERAZIONE CLICK & MORPHING
    const raycaster = new THREE.Raycaster();
    const mouseVector = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      mouseVector.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseVector.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouseVector, camera);
      const intersects = raycaster.intersectObject(icosahedron);

      if (intersects.length > 0) {
        const faceIndex = intersects[0].faceIndex;
        const projectIndex = faceIndex % projects.length;

        canvas.classList.add('morphing');
        
        setTimeout(() => {
          openProject(projectIndex);
        }, 700);
      }
    });

    // LOOP ANIMAZIONE
    function animate() {
      requestAnimationFrame(animate);

      // Rotazione di base autonoma
      icosahedron.rotation.x += 0.003;
      icosahedron.rotation.y += 0.004;

      // Inseguimento del mouse
      targetRotationY = mouseX * 0.6;
      targetRotationX = -mouseY * 0.6;

      icosahedron.rotation.y += (targetRotationY - icosahedron.rotation.y) * 0.04;
      icosahedron.rotation.x += (targetRotationX - icosahedron.rotation.x) * 0.04;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // APERTURA E CHIUSURA PROGETTI
    const projectStage = document.getElementById('projectStage');
    const imageLayer = document.getElementById('imageLayer');
    const redText = document.getElementById('redText');

    function openProject(index) {
      const proj = projects[index];

      imageLayer.innerHTML = '';
      proj.images.forEach(url => {
        const block = document.createElement('div');
        block.className = 'image-block';
        const img = document.createElement('img');
        img.src = url;
        block.appendChild(img);
        imageLayer.appendChild(block);
      });

      redText.innerText = proj.text;
      projectStage.classList.add('active');
    }

    function closeProject() {
      projectStage.classList.remove('active');
      setTimeout(() => {
        canvas.classList.remove('morphing');
      }, 400);
    }
  </script>
</body>
</html>
