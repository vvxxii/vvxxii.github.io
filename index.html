<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #webgl-canvas, .lobe-symbol, .popup, .popup-close, .popup-backdrop {
      cursor: none;
    }
    @media (pointer: coarse) {
      html, body, #webgl-canvas, .lobe-symbol, .popup, .popup-close, .popup-backdrop { cursor: auto; }
      #customCursor { display: none; }
    }

    body {
      background-color: #000;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
    }

    #webgl-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 10;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #webgl-canvas.screen-glitch { animation: screenGlitchPop 0.12s steps(2); }
    @keyframes screenGlitchPop {
      0%   { clip-path: inset(0 0 0 0); transform: translate(0,0); }
      30%  { clip-path: inset(10% 0 60% 0); transform: translate(-6px,0); }
      55%  { clip-path: inset(55% 0 8% 0); transform: translate(5px,0); }
      80%  { clip-path: inset(2% 0 85% 0); transform: translate(-3px,0); }
      100% { clip-path: inset(0 0 0 0); transform: translate(0,0); }
    }

    #vignette {
      position: fixed; inset: 0;
      z-index: 20;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.42) 78%, rgba(0,0,0,0.88) 100%);
      mix-blend-mode: multiply;
      animation: vignetteGlitch 5s infinite steps(1);
    }
    @keyframes vignetteGlitch {
      0%, 100% { opacity: 1; } 41% { opacity: 1; } 42% { opacity: 0.6; } 43% { opacity: 1; }
      77% { opacity: 1; } 78% { opacity: 0.75; transform: translateX(3px); } 79% { opacity: 1; transform: translateX(0); }
    }
    #grain {
      position: fixed; inset: 0;
      z-index: 21;
      pointer-events: none;
      opacity: 0.07;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      animation: grainShift 0.15s steps(2) infinite;
    }
    @keyframes grainShift {
      0% { transform: translate(0,0); } 50% { transform: translate(-3%,2%); } 100% { transform: translate(2%,-3%); }
    }

    #lobeSymbols {
      position: fixed; inset: 0;
      z-index: 25;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #lobeSymbols.hidden { opacity: 0; }
    .lobe-symbol {
      position: absolute;
      top: 0; left: 0;
      width: 26px; height: 26px;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      image-rendering: pixelated;
      pointer-events: auto;
      filter: drop-shadow(2px 2px 0 #000) drop-shadow(0 0 5px rgba(140,15,5,0.55));
      user-select: none;
      will-change: transform, opacity, left, top;
    }
    .lobe-symbol.dim { opacity: 0 !important; pointer-events: none; }

    #customCursor {
      position: fixed; top: 0; left: 0;
      z-index: 100;
      pointer-events: none;
      transform: translate(-50%, -50%);
      font-size: 1.15rem;
      color: #ffd93d;
      text-shadow: 0 0 6px rgba(255,217,61,0.85), 0 0 2px #000;
    }
    #customCursor .c-cross { display: inline-block; animation: cursorGlitch 1.4s infinite steps(1); }
    #customCursor .c-rod { display: none; color: #ff9a3d; text-shadow: 0 0 8px rgba(255,154,61,0.9); }
    #customCursor.interactive .c-cross { display: none; }
    #customCursor.interactive .c-rod { display: inline-block; }
    @keyframes cursorGlitch {
      0%, 100% { transform: translate(0,0); opacity: 1; }
      12% { transform: translate(1px,-1px); opacity: 0.65; }
      24% { transform: translate(-1px,1px); opacity: 1; }
      48% { transform: translate(0,0); }
      52% { transform: translate(2px,0); opacity: 0.55; }
      56% { transform: translate(0,0); opacity: 1; }
    }

    .popup-backdrop {
      position: fixed; inset: 0;
      z-index: 30;
      background: rgba(0,0,0,0.62);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .popup-backdrop.active { opacity: 1; pointer-events: auto; }

    /* spigoli vivi, nessun bordo arrotondato */
    .popup {
      position: fixed;
      background: #0a0707;
      border: 1px solid rgba(184,0,0,0.4);
      border-radius: 0;
      box-shadow: 0 30px 80px rgba(0,0,0,0.85);
      z-index: 31;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      overflow: hidden;
    }
    .popup.dragging { transition: none; }

    .popup-inner { width: 100%; height: 100%; position: relative; }

    .popup-photo {
      top: 50%; left: 50%;
      width: min(68vw, 1040px); height: 92vh;
      transform: translate(-50%,-50%) scale(0.94);
    }
    .popup-photo.active { transform: translate(-50%,-50%) scale(1); }

    /* testo: nessun contenitore visibile, solo la colonna di testo */
    .popup-text {
      top: 5vh; right: 5vw;
      width: min(15vw, 230px); height: 90vh;
      background: none;
      border: none;
      box-shadow: none;
      transform: translateY(10px);
    }
    .popup-text.active { transform: translateY(0); }

    .popup.active { opacity: 1; pointer-events: auto; }

    .popup-scroll { width: 100%; height: 100%; overflow-y: auto; scrollbar-width: none; }
    .popup-scroll::-webkit-scrollbar { display: none; }

    .popup-image-block { width: 100%; height: 84vh; position: relative; }
    .popup-image-block img {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.85) contrast(110%) grayscale(10%);
      opacity: 1;
    }

    /* testo semplice, senza effetti */
    .red-text-content {
      padding: 5px 7px;
      color: #b80000;
      font-size: 0.56rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: justify;
      background: transparent;
    }

    .popup-close {
      position: absolute; top: 0.7rem; right: 0.9rem;
      color: #ff2200;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem; line-height: 1;
      z-index: 5;
      background: transparent; border: none;
      text-shadow: 0 0 8px rgba(255,51,0,0.85), 0 0 3px #000;
      transition: transform 0.25s ease, text-shadow 0.25s ease;
    }
    .popup-close:hover { transform: scale(1.3); text-shadow: 0 0 16px rgba(255,120,0,0.95); }

    /* MOBILE: foto a tutto schermo, colonna testo più larga e testo più piccolo */
    @media (max-width: 768px) {
      .popup-photo {
        top: 0; left: 0; width: 100vw; height: 100vh;
        transform: none; border: none;
      }
      .popup-photo.active { transform: none; }
      .popup-image-block { height: 100vh; }

      .popup-text { width: 62vw; right: 4vw; }
      .red-text-content { font-size: 0.46rem; }
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="lobeSymbols"></div>

  <div id="customCursor">
    <span class="c-cross">+</span>
    <span class="c-rod">⚕</span>
  </div>

  <div class="popup-backdrop" id="popupBackdrop"></div>
  <div class="popup popup-photo" id="popupPhoto">
    <div class="popup-inner">
      <button class="popup-close" onclick="closeProject()">✕</button>
      <div class="popup-scroll" id="imageLayer"></div>
    </div>
  </div>
  <div class="popup popup-text" id="popupText">
    <div class="popup-inner">
      <button class="popup-close" onclick="closeProject()">✕</button>
      <div class="popup-scroll">
        <div class="red-text-content" id="redText"></div>
      </div>
    </div>
  </div>

  <script>
    const projects = [
      {
        id: "PROJECT_01",
        text: "REGISTRO DI DECOMPOSIZIONE ESTETICA // Scomposizione organica della materia luminosa. La carne e l'acciaio convergono in un unico punto focale. Nessuna presenza umana rilevata oltre la soglia del silenzio. Architettura priva di gravità apparente, fondata su principi di contrazione ed espansione volumetrica. Ogni sezione fotografica costituisce un reperto esumato da strati geologici sotterranei. Frequenze visive ridotte ai minimi termini per stimolare una percezione pura, viscerale, priva di interferenze esterne. L'oscurità non è assenza di luce, ma presenza densa di materia non riflettente.",
        images: [
          'https://picsum.photos/id/1025/1600/1000',
          'https://picsum.photos/id/1040/1600/1000',
          'https://picsum.photos/id/1062/1600/1000',
          'https://picsum.photos/id/1069/1600/1000'
        ]
      },
      {
        id: "PROJECT_02",
        text: "SPAZIO GEOLOGICO CORRETTO // Infiltrazione di frequenze scure su superfici architettoniche monolitiche. Nessun segnale di ritorno. L'occhio osserva la struttura priva di massa. Sequenze d'ombra calcolate secondo algoritmi di rifrazione minerale. Il corpo reattivo si adatta all'ambiente ostile tramite una serie di trasformazioni anatomiche temporanee.",
        images: [
          'https://picsum.photos/id/1050/1600/1000',
          'https://picsum.photos/id/1060/1600/1000'
        ]
      }
    ];

    const SYMBOLS = ["☯", "👁", "♠", "☞", "❧", "@"];
    const ICON_RGB = [156, 22, 8]; // rosso scuro e saturo, non più "pallido"

    // costruisce un'icona 8-bit: disegna il glifo piccolo, poi elimina l'antialiasing
    // (soglia sul canale alfa) e forza un colore piatto -> silhouette a pixel netti
    function buildPixelIcon(char) {
      const src = 18;
      const c = document.createElement('canvas');
      c.width = src; c.height = src;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(char, src / 2, src / 2 + 1);

      const imgData = ctx.getImageData(0, 0, src, src);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] > 90) {
          d[i] = ICON_RGB[0]; d[i + 1] = ICON_RGB[1]; d[i + 2] = ICON_RGB[2]; d[i + 3] = 255;
        } else {
          d[i + 3] = 0;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return c.toDataURL();
    }

    const LOBE_COUNT = 6;
    const RENDER_SCALE = 0.42;

    const VERT = `
      void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    const FRAG = `
      precision highp float;
      #define LOBE_COUNT ${LOBE_COUNT}
      #define SEGS 4
      #define MAX_STEPS 80
      #define MAX_DIST 24.0
      #define SURF_DIST 0.002

      uniform vec2  uResolution;
      uniform float uTime;
      uniform vec3  uCamPos;
      uniform vec3  uCamRight;
      uniform vec3  uCamUp;
      uniform vec3  uCamForward;
      uniform float uTanFov;
      uniform mat3  uInvRot;
      uniform vec3  uLobeDir[LOBE_COUNT];
      uniform float uLobeLen[LOBE_COUNT];
      uniform float uLobeRadius[LOBE_COUNT];
      uniform float uLobeGlow[LOBE_COUNT];
      uniform float uLobePhase[LOBE_COUNT];
      uniform float uGlitch;
      uniform float uPaletteFlash;

      float hash13(vec3 p) {
        p = fract(p * 0.3183099 + 0.1);
        p *= 17.0;
        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
      }

      float vnoise(vec3 p) {
        vec3 i = floor(p); vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float n000=hash13(i+vec3(0,0,0)), n100=hash13(i+vec3(1,0,0));
        float n010=hash13(i+vec3(0,1,0)), n110=hash13(i+vec3(1,1,0));
        float n001=hash13(i+vec3(0,0,1)), n101=hash13(i+vec3(1,0,1));
        float n011=hash13(i+vec3(0,1,1)), n111=hash13(i+vec3(1,1,1));
        return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
                    mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y), f.z);
      }

      float fbm(vec3 p) {
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 4; i++) { v += a * vnoise(p); p *= 2.02; a *= 0.5; }
        return v;
      }

      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      float sdSphere(vec3 p, vec3 c, float r) { return length(p - c) - r; }

      float lobeExt(float phase) {
        return 0.28 + 0.72 * (0.5 + 0.5 * sin(uTime * 0.32 + phase * 2.0));
      }

      float sceneSDF(vec3 p, out float glowAmt) {
        vec3 op = uInvRot * p;

        float breathe = 0.04 * sin(uTime * 0.8);
        vec3 nrm = normalize(op + 0.0001);
        float coreNoise = fbm(nrm * 2.4 + uTime * 0.03);
        float coreR = 0.42 + coreNoise * 0.22 + breathe * 0.12;
        float d = length(op) - coreR;
        glowAmt = 0.0;

        for (int i = 0; i < LOBE_COUNT; i++) {
          float ext = lobeExt(uLobePhase[i]);
          float len = uLobeLen[i] * ext;

          for (int s = 0; s < SEGS; s++) {
            float h = float(s) / float(SEGS - 1);
            vec3 segPos = uLobeDir[i] * mix(0.18, len, h);
            float segR = uLobeRadius[i] * mix(1.7, 0.4, h) * (0.55 + 0.45 * ext);
            d = smin(d, sdSphere(op, segPos, segR), 0.22);
          }

          vec3 tip = uLobeDir[i] * len;
          float dist = length(op - tip);
          float sigma = uLobeRadius[i] * 2.4;
          glowAmt += uLobeGlow[i] * exp(-(dist * dist) / (2.0 * sigma * sigma));
        }

        float wrinkle = fbm(op * 3.4 + uTime * 0.05) - 0.5;
        d += wrinkle * 0.04;

        float decay = fbm(op * 2.1 + uTime * 0.12);
        float holeMask = smoothstep(0.53, 0.64, decay);
        d += holeMask * 2.2;

        float glitchNoise = fbm(op * 9.0 + uTime * 6.0);
        d -= step(0.83, glitchNoise) * uGlitch * 0.13;

        return d;
      }

      vec3 calcNormal(vec3 p) {
        vec2 e = vec2(0.002, 0.0);
        float g;
        return normalize(vec3(
          sceneSDF(p + e.xyy, g) - sceneSDF(p - e.xyy, g),
          sceneSDF(p + e.yxy, g) - sceneSDF(p - e.yxy, g),
          sceneSDF(p + e.yyx, g) - sceneSDF(p - e.yyx, g)
        ));
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy / uResolution - 0.5) * 2.0;
        uv.x *= uResolution.x / uResolution.y;

        vec2 blockUv = floor(gl_FragCoord.xy / 7.0);
        float blockN = hash13(vec3(blockUv, floor(uTime * 30.0)));
        vec2 jitter = (blockN > 0.85)
          ? (vec2(hash13(vec3(blockUv,1.0)), hash13(vec3(blockUv,2.0))) - 0.5) * uGlitch * 0.05
          : vec2(0.0);

        vec3 rd = normalize(uCamForward + (uv.x + jitter.x) * uTanFov * uCamRight + (uv.y + jitter.y) * uTanFov * uCamUp);
        vec3 ro = uCamPos;

        float t = 0.0; float glow = 0.0; bool hit = false; int steps = 0;
        vec3 p = ro;

        for (int i = 0; i < MAX_STEPS; i++) {
          p = ro + rd * t;
          float g;
          float d = sceneSDF(p, g);
          steps = i;
          if (d < SURF_DIST) { hit = true; glow = g; break; }
          t += d;
          if (t > MAX_DIST) break;
        }

        vec3 col = vec3(0.0);

        if (hit) {
          vec3 n = calcNormal(p);
          vec3 op = uInvRot * p;
          vec3 viewDir = -rd;

          vec3 lightPos = vec3(2.2, 1.6, 3.2);
          vec3 lightDir = normalize(lightPos - p);
          float diff = max(dot(n, lightDir), 0.0);

          vec3 rimDir = normalize(vec3(-3.0, -1.5, -2.0) - p);
          float rim = max(dot(n, rimDir), 0.0);

          float fres = pow(1.0 - max(dot(n, viewDir), 0.0), 3.0);

          float mottle = fbm(op * 2.6);
          vec3 baseColor = mix(vec3(0.05,0.018,0.018), vec3(0.16,0.05,0.045), mottle);

          vec3 warmRed    = vec3(1.0, 0.34, 0.12);
          vec3 warmGreen  = vec3(0.55, 1.0, 0.15);
          vec3 warmYellow = vec3(1.0, 0.86, 0.15);
          vec3 warm = warmRed;
          if (uPaletteFlash > 1.5) warm = warmYellow;
          else if (uPaletteFlash > 0.5) warm = warmGreen;

          vec3 cool = vec3(0.10, 0.05, 0.20);

          col = baseColor * (0.07 + diff * 0.85) * warm;
          col += baseColor * rim * 0.2 * cool;
          col += fres * warm * 0.3;

          vec3 halfDir = normalize(lightDir + viewDir);
          float spec = pow(max(dot(n, halfDir), 0.0), 70.0);
          col += vec3(1.0, 0.95, 0.9) * spec * 0.9;
          float specRim = pow(max(dot(n, normalize(rimDir + viewDir)), 0.0), 40.0);
          col += cool * specRim * 0.5;

          col += warm * glow * 1.3;

          float fog = 1.0 - exp(-t * 0.1);
          col = mix(col, vec3(0.0), fog);

          col *= 0.65 + 0.35 * (1.0 - float(steps) / float(MAX_STEPS));
        }

        col.r += hash13(vec3(gl_FragCoord.xy * 0.7, uTime * 30.0)) * uGlitch * 0.12;
        col.b -= hash13(vec3(gl_FragCoord.xy * 0.9, uTime * 31.0)) * uGlitch * 0.08;

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    let camDist = 5.5;
    const ZOOM_MIN = 2.4, ZOOM_MAX = 9.5;
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let popupOpen = false; // quando true, il raymarch si ferma del tutto (risparmio risorse)

    (function init() {
      const canvas = document.getElementById('webgl-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
      renderer.setPixelRatio(1);

      function sizeRenderer() {
        const w = Math.max(2, Math.floor(window.innerWidth * RENDER_SCALE));
        const h = Math.max(2, Math.floor(window.innerHeight * RENDER_SCALE));
        renderer.setSize(w, h, false);
        return { w, h };
      }
      let res = sizeRenderer();

      const scene = new THREE.Scene();
      const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const camPos = new THREE.Vector3(0, 0, camDist);
      const camForward = new THREE.Vector3(0, 0, -1);
      const camRight = new THREE.Vector3(1, 0, 0);
      const camUp = new THREE.Vector3(0, 1, 0);
      const FOV = THREE.MathUtils.degToRad(45);
      const tanFov = Math.tan(FOV / 2);

      const lobes = [];
      for (let i = 0; i < LOBE_COUNT; i++) {
        const y = 1 - (i / (LOBE_COUNT - 1)) * 2;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = Math.PI * (3 - Math.sqrt(5)) * i;
        const dir = new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r).normalize();
        const projectIndex = i % projects.length;
        lobes.push({
          dir,
          len: 1.35 + Math.random() * 1.35,
          radius: 0.16 + Math.random() * 0.07,
          project: projectIndex,
          symbol: SYMBOLS[i],
          phase: Math.random() * Math.PI * 2,
          glow: 0,
          el: null, dispX: null, dispY: null
        });
      }

      const symbolsRoot = document.getElementById('lobeSymbols');
      const cursorEl = document.getElementById('customCursor');

      lobes.forEach((l, i) => {
        const el = document.createElement('div');
        el.className = 'lobe-symbol dim';
        el.style.backgroundImage = `url(${buildPixelIcon(l.symbol)})`;
        el.addEventListener('mouseenter', () => { hoveredLobe = i; cursorEl.classList.add('interactive'); });
        el.addEventListener('mouseleave', () => { if (hoveredLobe === i) hoveredLobe = -1; cursorEl.classList.remove('interactive'); });
        el.addEventListener('click', (ev) => { ev.stopPropagation(); triggerGlitchPop(); openProject(l.project); });
        symbolsRoot.appendChild(el);
        l.el = el;
      });

      document.querySelectorAll('.popup-close').forEach(btn => {
        btn.addEventListener('mouseenter', () => cursorEl.classList.add('interactive'));
        btn.addEventListener('mouseleave', () => cursorEl.classList.remove('interactive'));
      });

      const uniforms = {
        uResolution: { value: new THREE.Vector2(res.w, res.h) },
        uTime: { value: 0 },
        uCamPos: { value: camPos },
        uCamRight: { value: camRight },
        uCamUp: { value: camUp },
        uCamForward: { value: camForward },
        uTanFov: { value: tanFov },
        uInvRot: { value: new THREE.Matrix3() },
        uLobeDir: { value: lobes.map(l => l.dir) },
        uLobeLen: { value: lobes.map(l => l.len) },
        uLobeRadius: { value: lobes.map(l => l.radius) },
        uLobeGlow: { value: lobes.map(() => 0) },
        uLobePhase: { value: lobes.map(l => l.phase) },
        uGlitch: { value: 0 },
        uPaletteFlash: { value: 0 }
      };

      const material = new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: FRAG, uniforms });
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
      scene.add(quad);

      let yaw = 0, pitch = 0;
      let velYaw = 0, velPitch = 0;
      let isDragging = false;
      let lastX = window.innerWidth / 2, lastY = window.innerHeight / 2;
      let rotM3 = new THREE.Matrix3();
      let invRot = new THREE.Matrix3();
      let hoveredLobe = -1;

      function updateRotation(dt, t) {
        velYaw *= 0.94;
        velPitch *= 0.94;
        const idleYaw = 0.09 + 0.05 * Math.sin(t * 0.13);
        const idlePitch = 0.04 * Math.sin(t * 0.07 + 1.3);
        yaw += velYaw + idleYaw * dt;
        pitch += velPitch + idlePitch * dt;
        pitch = THREE.MathUtils.clamp(pitch, -1.1, 1.1);

        const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yaw);
        const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), pitch);
        const q = qYaw.multiply(qPitch);
        const M4 = new THREE.Matrix4().makeRotationFromQuaternion(q);
        rotM3.setFromMatrix4(M4);
        invRot.copy(rotM3).transpose();
        uniforms.uInvRot.value.copy(invRot);
      }

      function dragStart(x, y, targetEl) {
        if (targetEl && targetEl.closest('.lobe-symbol, .popup, .popup-close')) return;
        isDragging = true;
        lastX = x; lastY = y;
      }
      function dragMove(x, y) {
        mouseX = x; mouseY = y;
        cursorEl.style.left = x + 'px';
        cursorEl.style.top = y + 'px';
        if (!isDragging) return;
        const dx = x - lastX, dy = y - lastY;
        velYaw += dx * 0.0012;
        velPitch += dy * 0.0012;
        lastX = x; lastY = y;
      }
      function dragEnd() { isDragging = false; }

      window.addEventListener('mousedown', (e) => dragStart(e.clientX, e.clientY, e.target));
      window.addEventListener('mouseup', dragEnd);
      window.addEventListener('mousemove', (e) => dragMove(e.clientX, e.clientY));

      // touch: muovere il blob col dito
      window.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        dragStart(t.clientX, t.clientY, e.target);
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        dragMove(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchend', dragEnd);
      window.addEventListener('touchcancel', dragEnd);

      window.addEventListener('wheel', (e) => {
        camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.0035 * camDist, ZOOM_MIN, ZOOM_MAX);
        e.preventDefault();
      }, { passive: false });

      function worldToScreen(worldPos) {
        const rel = worldPos.clone().sub(camPos);
        const zCam = rel.dot(camForward);
        if (zCam <= 0.05) return null;
        const xCam = rel.dot(camRight);
        const yCam = rel.dot(camUp);
        const aspect = window.innerWidth / window.innerHeight;
        const uvXafter = xCam / (zCam * tanFov);
        const uvY = yCam / (zCam * tanFov);
        const sx = ((uvXafter / aspect) * 0.5 + 0.5) * window.innerWidth;
        const syFromBottom = (uvY * 0.5 + 0.5) * window.innerHeight;
        const sy = window.innerHeight - syFromBottom;
        return { x: sx, y: sy, zCam };
      }

      function lobeExtension(phase, time) {
        return 0.28 + 0.72 * (0.5 + 0.5 * Math.sin(time * 0.32 + phase * 2.0));
      }

      const MAGNET_R = 140;
      const MAGNET_MAX = 0.55;
      const MAGNET_EASE = 0.22;

      function updateSymbols(time) {
        lobes.forEach((l) => {
          const ext = lobeExtension(l.phase, time);
          const worldPos = l.dir.clone().multiplyScalar(l.len * ext).applyMatrix3(rotM3);
          const proj = worldToScreen(worldPos);

          if (!proj) { l.el.classList.add('dim'); return; }

          const outwardDir = worldPos.clone().normalize();
          const facing = -outwardDir.dot(camForward);
          if (facing < 0.05) { l.el.classList.add('dim'); return; }

          l.el.classList.remove('dim');

          if (l.dispX === null) { l.dispX = proj.x; l.dispY = proj.y; }

          const dx = mouseX - proj.x, dy = mouseY - proj.y;
          const dist = Math.hypot(dx, dy);
          const pull = Math.max(0, 1 - dist / MAGNET_R);
          const pullStrength = pull * pull * MAGNET_MAX;
          const targetX = proj.x + dx * pullStrength;
          const targetY = proj.y + dy * pullStrength;

          l.dispX += (targetX - l.dispX) * MAGNET_EASE;
          l.dispY += (targetY - l.dispY) * MAGNET_EASE;

          const scale = (0.72 + ext * 0.4) * (1 + pull * 1.3);
          l.el.style.transform = `translate(-50%,-50%) scale(${scale.toFixed(2)})`;
          l.el.style.left = l.dispX + 'px';
          l.el.style.top = l.dispY + 'px';
          l.el.style.opacity = Math.min(1, facing * 1.8).toFixed(2);
        });
      }

      let glitchLevel = 0.1;
      let glitchClock = 0, nextGlitchAt = 0.3;
      function triggerGlitchPop() {
        canvas.classList.remove('screen-glitch');
        void canvas.offsetWidth;
        canvas.classList.add('screen-glitch');
      }
      function flashPalette() {
        uniforms.uPaletteFlash.value = Math.random() < 0.5 ? 1 : 2;
        const dur = 80 + Math.random() * 160;
        setTimeout(() => { uniforms.uPaletteFlash.value = 0; }, dur);
      }
      function updateGlitch(dt) {
        glitchClock += dt;
        glitchLevel = Math.max(0.1, glitchLevel - dt * 3.0);
        if (glitchClock >= nextGlitchAt) {
          glitchClock = 0;
          nextGlitchAt = 0.15 + Math.random() * 0.6;
          glitchLevel = 0.5 + Math.random() * 0.5;
          if (Math.random() < 0.3) triggerGlitchPop();
          if (Math.random() < 0.22) flashPalette();
        }
        uniforms.uGlitch.value = glitchLevel;
      }

      const RISE_RATE = 9.0, FALL_RATE = 2.0;
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        // POP UP APERTO -> il blob non è visibile: niente raymarch, niente calcoli,
        // risorse libere per il drag/scroll dei pop up (risolve il lag del cursore)
        if (popupOpen) { clock.getDelta(); return; }

        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;
        uniforms.uTime.value = t;

        camPos.set(0, 0, camDist);

        updateRotation(dt, t);
        updateGlitch(dt);
        updateSymbols(t);

        for (let i = 0; i < LOBE_COUNT; i++) {
          const target = (hoveredLobe === i) ? 1 : 0;
          const rate = target > lobes[i].glow ? RISE_RATE : FALL_RATE;
          lobes[i].glow += (target - lobes[i].glow) * Math.min(1, rate * dt);
          uniforms.uLobeGlow.value[i] = lobes[i].glow;
        }

        renderer.render(scene, orthoCam);
      }
      animate();

      window.addEventListener('resize', () => {
        res = sizeRenderer();
        uniforms.uResolution.value.set(res.w, res.h);
      });
    })();

    function makeDraggable(el) {
      let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
      function start(x, y, targetEl) {
        if (targetEl && targetEl.closest('.popup-close')) return;
        dragging = true;
        el.classList.add('dragging');
        const rect = el.getBoundingClientRect();
        origLeft = rect.left; origTop = rect.top;
        el.style.right = 'auto';
        el.style.transform = 'none';
        startX = x; startY = y;
      }
      function move(x, y) {
        if (!dragging) return;
        el.style.left = (origLeft + (x - startX)) + 'px';
        el.style.top = (origTop + (y - startY)) + 'px';
      }
      function end() { dragging = false; el.classList.remove('dragging'); }

      el.addEventListener('mousedown', (e) => { start(e.clientX, e.clientY, e.target); e.preventDefault(); e.stopPropagation(); });
      window.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
      window.addEventListener('mouseup', end);

      el.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        start(t.clientX, t.clientY, e.target);
        e.stopPropagation();
      }, { passive: true });
      window.addEventListener('touchmove', (e) => { if (dragging) { const t = e.touches[0]; move(t.clientX, t.clientY); } }, { passive: true });
      window.addEventListener('touchend', end);
    }

    const popupBackdrop = document.getElementById('popupBackdrop');
    const popupPhoto = document.getElementById('popupPhoto');
    const popupText = document.getElementById('popupText');
    const imageLayer = document.getElementById('imageLayer');
    const redText = document.getElementById('redText');
    const lobeSymbolsEl = document.getElementById('lobeSymbols');

    makeDraggable(popupPhoto);
    makeDraggable(popupText);

    function resetPopupPosition(el) {
      el.style.left = ''; el.style.top = ''; el.style.right = ''; el.style.transform = '';
    }

    function openProject(index) {
      const proj = projects[index];
      imageLayer.innerHTML = '';
      proj.images.forEach(url => {
        const block = document.createElement('div');
        block.className = 'popup-image-block';
        const img = document.createElement('img');
        img.src = url;
        block.appendChild(img);
        imageLayer.appendChild(block);
      });
      redText.innerText = proj.text;
      popupBackdrop.classList.add('active');
      popupPhoto.classList.add('active');
      popupText.classList.add('active');
      lobeSymbolsEl.classList.add('hidden');
      popupOpen = true;
    }

    function closeProject() {
      popupBackdrop.classList.remove('active');
      popupPhoto.classList.remove('active');
      popupText.classList.remove('active');
      lobeSymbolsEl.classList.remove('hidden');
      popupOpen = false;
      setTimeout(() => { resetPopupPosition(popupPhoto); resetPopupPosition(popupText); }, 420);
    }

    popupBackdrop.addEventListener('click', closeProject);
  </script>
</body>
</html>
