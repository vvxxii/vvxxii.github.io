<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      cursor: grab;
      transition: opacity 0.8s ease, filter 0.8s ease;
      mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 80%);
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 80%);
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    #webgl-canvas.hidden {
      opacity: 0;
      filter: blur(25px) contrast(300%);
      pointer-events: none;
    }

    .project-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .project-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    .image-scroll-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 1;
    }

    .image-scroll-layer::-webkit-scrollbar { display: none; }

    .image-block {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .image-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65) contrast(135%) grayscale(60%);
    }

    /* TIPOGRAFIA MICRO-COMPATTA */
    .text-scroll-layer {
      position: absolute;
      top: 0;
      right: 12vw;
      width: 200px;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 2;
      padding: 30vh 0;
      pointer-events: auto;
    }

    .text-scroll-layer::-webkit-scrollbar { display: none; }

    .red-text-content {
      color: #b80000;
      font-size: 0.58rem; /* Font ancora più piccolo */
      font-weight: 400;
      line-height: 1.5;   /* Interlinea ridotta */
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: justify;
      background: transparent;
      text-shadow: 0 0 6px rgba(184, 0, 0, 0.35);
    }

    .close-btn {
      position: fixed;
      top: 2.5rem;
      left: 3rem;
      color: #555;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 4px;
      cursor: pointer;
      z-index: 100;
      background: transparent;
      border: none;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .close-btn:hover {
      color: #b80000;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="project-stage" id="projectStage">
    <button class="close-btn" onclick="closeProject()">[ REGRESS ]</button>

    <div class="image-scroll-layer" id="imageLayer"></div>

    <div class="text-scroll-layer" id="textLayer">
      <div class="red-text-content" id="redText"></div>
    </div>
  </div>

  <script>
    const projects = [
      {
        id: "PROJECT_01",
        text: "Scomposizione organica della materia luminosa. La carne e l'acciaio convergono in un unico punto focale. Nessuna presenza umana rilevata oltre la soglia del silenzio. Registro di decomposizione estetica. Architettura priva di gravità apparente, fondata su principi di contrazione ed espansione volumetrica. Ogni sezione fotografica costituisce un reperto esumato da strati geologici sotterranei.",
        images: [
          'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600',
          'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1600',
          'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1600'
        ]
      },
      {
        id: "PROJECT_02",
        text: "Spazio geologico corretto. Infiltrazione di frequenze scure su superfici architettoniche monolitiche. Nessun segnale di ritorno. L'occhio osserva la struttura priva di massa. Sequenze d'ombra calcolate secondo algoritmi di rifrazione minerale. Il corpo reattivo si adatta all'ambiente ostile.",
        images: [
          'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600',
          'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1600'
        ]
      },
      {
        id: "PROJECT_03",
        text: "Rumore chimico e tossico su pellicola arida. Esperimento di saturazione viscerale. Frequenze visive ridotte ai minimi termini per stimolare una percezione pura. L'oscurità come presenza densa e non riflettente.",
        images: [
          'https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1600',
          'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600'
        ]
      }
    ];

    // SETUP THREE.JS
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5.5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // GENERAZIONE PROCEDURALE TEXTURE PER FACCE ICOSAEDRO (NO PROBLEMI CORS)
    function generateGlitchTexture() {
      const texCanvas = document.createElement('canvas');
      texCanvas.width = 512;
      texCanvas.height = 512;
      const ctx = texCanvas.getContext('2d');

      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, 512, 512);

      // Sfondi sfumati e grana
      for (let i = 0; i < 400; i++) {
        const val = Math.floor(Math.random() * 120);
        ctx.fillStyle = `rgb(${val},${val},${val})`;
        ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 60, Math.random() * 4);
      }

      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 20; i++) {
        ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 120, 1);
      }

      return new THREE.CanvasTexture(texCanvas);
    }

    const texture = generateGlitchTexture();
    const geometry = new THREE.IcosahedronGeometry(1.8, 0);

    const material = new THREE.MeshStandardMaterial({
      map: texture,
      metalness: 0.9,
      roughness: 0.12,
      transparent: true,
      opacity: 0.88,
      flatShading: true
    });

    const icosahedron = new THREE.Mesh(geometry, material);
    scene.add(icosahedron);

    // LUCI
    const light1 = new THREE.DirectionalLight(0xffffff, 3.0);
    light1.position.set(5, 5, 5);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0x444444, 1.5);
    light2.position.set(-5, -5, -2);
    scene.add(light2);

    const ambientLight = new THREE.AmbientLight(0x0a0a0a);
    scene.add(ambientLight);

    // DRAG MOUSE
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaMove = {
        x: e.clientX - previousMousePosition.x,
        y: e.clientY - previousMousePosition.y
      };

      icosahedron.rotation.y += deltaMove.x * 0.008;
      icosahedron.rotation.x += deltaMove.y * 0.008;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // INTERAZIONE CLICK SULLE FACCE
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(icosahedron);

      if (intersects.length > 0) {
        const faceIndex = intersects[0].faceIndex;
        const projectIndex = faceIndex % projects.length;
        openProject(projectIndex);
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      if (!isDragging) {
        icosahedron.rotation.x += 0.0025;
        icosahedron.rotation.y += 0.0045;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // APERTURA E CHIUSURA PROGETTI
    const projectStage = document.getElementById('projectStage');
    const imageLayer = document.getElementById('imageLayer');
    const redText = document.getElementById('redText');

    function openProject(index) {
      const proj = projects[index];

      imageLayer.innerHTML = '';
      proj.images.forEach(url => {
        const block = document.createElement('div');
        block.className = 'image-block';
        const img = document.createElement('img');
        img.src = url;
        block.appendChild(img);
        imageLayer.appendChild(block);
      });

      redText.innerText = proj.text;

      canvas.classList.add('hidden');
      setTimeout(() => {
        projectStage.classList.add('active');
      }, 400);
    }

    function closeProject() {
      projectStage.classList.remove('active');
      setTimeout(() => {
        canvas.classList.remove('hidden');
      }, 300);
    }
  </script>
</body>
</html>
