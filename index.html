<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #888;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    /* FLUSSO PRINCIPALE (A SINISTRA) */
    .main-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(100vw - 80px);
      height: 100vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      z-index: 1;
    }

    .main-feed::-webkit-scrollbar {
      display: none;
    }

    /* Ogni elemento nel main occupa l'intero schermo */
    .media-screen {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .media-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.85) contrast(110%);
    }

    /* Blocchi di testo trattati come blocchi visuali a tutto schermo */
    .text-screen {
      width: 100%;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      flex-shrink: 0;
    }

    .text-screen p {
      font-size: 0.85rem;
      line-height: 1.8;
      color: #777;
      letter-spacing: 2px;
      text-transform: uppercase;
      max-width: 800px;
      text-align: justify;
    }

    /* COLONNA A DESTRA (FOTO CONTINUE SENZA SPAZI) */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 80px;
      height: 100vh;
      background: #000;
      z-index: 100;
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
    }

    .sidebar::-webkit-scrollbar {
      display: none;
    }

    .thumb-item {
      width: 100%;
      height: 100px;
      flex-shrink: 0;
      cursor: pointer;
      overflow: hidden;
      opacity: 0.35;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%);
    }

    .thumb-item:hover {
      opacity: 0.75;
    }

    .thumb-item.active {
      opacity: 1;
    }

    .thumb-item.active img {
      filter: grayscale(0%);
    }
  </style>
</head>
<body>

  <!-- AREA PRINCIPALE (A SCHERMO INTERO) -->
  <main class="main-feed" id="mainFeed">
    <!-- Generato dinamicamente -->
  </main>

  <!-- STRISCIA CONTINUA MINIATURE (A DESTRA) -->
  <aside class="sidebar" id="sidebar">
    <!-- Generata dinamicamente -->
  </aside>

  <script>
    const projects = [
      {
        id: 'SEC_01',
        cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600',
        content: [
          { type: 'image', value: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600' },
          { type: 'text', value: 'Studio viscerale della luce radente su superfici industriali scomposizioni e ombre profonde.' },
          { type: 'image', value: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1600' },
          { type: 'text', value: 'Assenza di colore primario. Dominanza dei grigi ossidati e saturazione controllata.' },
          { type: 'image', value: 'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1600' }
        ]
      },
      {
        id: 'SEC_02',
        cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600',
        content: [
          { type: 'image', value: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600' },
          { type: 'text', value: 'Rilievi su geometrie architettoniche deserte e superfici prive di presenza umana.' },
          { type: 'image', value: 'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1600' }
        ]
      },
      {
        id: 'SEC_03',
        cover: 'https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1600',
        content: [
          { type: 'image', value: 'https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1600' },
          { type: 'text', value: 'Frequenze visive ridotte all’essenziale. Strutture portanti svelate dal buio.' }
        ]
      },
      {
        id: 'SEC_04',
        cover: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1600',
        content: [
          { type: 'image', value: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1600' },
          { type: 'text', value: 'Grana spessa ed esposizioni estreme su pellicola chimica.' }
        ]
      }
    ];

    let activeProjectIndex = 0;

    const mainFeed = document.getElementById('mainFeed');
    const sidebar = document.getElementById('sidebar');

    function initSidebar() {
      sidebar.innerHTML = '';
      projects.forEach((proj, idx) => {
        const item = document.createElement('div');
        item.className = `thumb-item ${idx === activeProjectIndex ? 'active' : ''}`;
        item.onclick = () => selectProject(idx);

        const img = document.createElement('img');
        img.src = proj.cover;

        item.appendChild(img);
        sidebar.appendChild(item);
      });
    }

    function selectProject(index) {
      activeProjectIndex = index;
      const proj = projects[index];

      initSidebar();

      mainFeed.innerHTML = '';
      proj.content.forEach(item => {
        if (item.type === 'image') {
          const screen = document.createElement('div');
          screen.className = 'media-screen';
          const img = document.createElement('img');
          img.src = item.value;
          screen.appendChild(img);
          mainFeed.appendChild(screen);
        } else if (item.type === 'text') {
          const screen = document.createElement('div');
          screen.className = 'text-screen';
          const p = document.createElement('p');
          p.innerText = item.value;
          screen.appendChild(p);
          mainFeed.appendChild(screen);
        }
      });

      mainFeed.scrollTop = 0;
    }

    selectProject(0);
  </script>
</body>
</html>
