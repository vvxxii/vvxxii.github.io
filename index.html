<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #webgl-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 10;
      cursor: crosshair;
      filter: contrast(120%) brightness(0.92) saturate(85%);
      transition: transform 0.9s cubic-bezier(0.7,0,0.3,1), opacity 0.8s ease, filter 0.8s ease;
    }

    #webgl-canvas.morphing {
      transform: scale(4.5);
      filter: blur(15px) contrast(200%);
      opacity: 0;
      pointer-events: none;
    }

    /* vignettatura globale + atmosfera dungeon */
    #vignette {
      position: fixed; inset: 0;
      z-index: 20;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.96) 100%);
      mix-blend-mode: multiply;
    }

    /* grana pellicola / rumore che flickera */
    #grain {
      position: fixed; inset: 0;
      z-index: 21;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      animation: grainShift 0.4s steps(2) infinite;
    }
    @keyframes grainShift {
      0% { transform: translate(0,0); }
      50% { transform: translate(-2%,1%); }
      100% { transform: translate(1%,-2%); }
    }

    .project-stage {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.3s;
      background: #000;
    }
    .project-stage.active { opacity: 1; pointer-events: auto; }

    .image-scroll-layer {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 1;
    }
    .image-scroll-layer::-webkit-scrollbar { display: none; }

    .image-block { width: 100vw; height: 100vh; position: relative; }

    .image-block img {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.5) contrast(140%) grayscale(70%) sepia(20%);
      opacity: 0.88;
    }

    .image-block::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
    }

    .text-scroll-layer {
      position: absolute; top: 0; right: 10vw;
      width: 200px; height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 2;
      padding-top: 2.5rem;
      padding-bottom: 20vh;
      pointer-events: auto;
    }
    .text-scroll-layer::-webkit-scrollbar { display: none; }

    .red-text-content {
      color: #b80000;
      font-size: 0.58rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: justify;
      background: transparent;
      text-shadow: 0 0 6px rgba(184,0,0,0.35);
    }

    .close-btn {
      position: fixed; top: 2.5rem; left: 3rem;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem; line-height: 1;
      cursor: pointer; z-index: 100;
      background: transparent; border: none;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .close-btn:hover { color: #b80000; transform: scale(1.2); }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>

  <div class="project-stage" id="projectStage">
    <button class="close-btn" onclick="closeProject()">✕</button>
    <div class="image-scroll-layer" id="imageLayer"></div>
    <div class="text-scroll-layer" id="textLayer">
      <div class="red-text-content" id="redText"></div>
    </div>
  </div>

  <script>
    const projects = [
      {
        id: "PROJECT_01",
        text: "REGISTRO DI DECOMPOSIZIONE ESTETICA // Scomposizione organica della materia luminosa. La carne e l'acciaio convergono in un unico punto focale. Nessuna presenza umana rilevata oltre la soglia del silenzio. Architettura priva di gravità apparente, fondata su principi di contrazione ed espansione volumetrica. Ogni sezione fotografica costituisce un reperto esumato da strati geologici sotterranei. Frequenze visive ridotte ai minimi termini per stimolare una percezione pura, viscerale, priva di interferenze esterne. L'oscurità non è assenza di luce, ma presenza densa di materia non riflettente.",
        images: [
          'https://picsum.photos/id/1025/1600/1000',
          'https://picsum.photos/id/1040/1600/1000',
          'https://picsum.photos/id/1062/1600/1000',
          'https://picsum.photos/id/1069/1600/1000'
        ]
      },
      {
        id: "PROJECT_02",
        text: "SPAZIO GEOLOGICO CORRETTO // Infiltrazione di frequenze scure su superfici architettoniche monolitiche. Nessun segnale di ritorno. L'occhio osserva la struttura priva di massa. Sequenze d'ombra calcolate secondo algoritmi di rifrazione minerale. Il corpo reattivo si adatta all'ambiente ostile tramite una serie di trasformazioni anatomiche temporanee.",
        images: [
          'https://picsum.photos/id/1050/1600/1000',
          'https://picsum.photos/id/1060/1600/1000'
        ]
      }
    ];

    // pool di immagini reali da distribuire sulle 20 facce dell'icosaedro
    const facePool = [
      'https://picsum.photos/id/1025/700/700','https://picsum.photos/id/1040/700/700',
      'https://picsum.photos/id/1062/700/700','https://picsum.photos/id/1069/700/700',
      'https://picsum.photos/id/1050/700/700','https://picsum.photos/id/1060/700/700',
      'https://picsum.photos/id/110/700/700','https://picsum.photos/id/122/700/700',
      'https://picsum.photos/id/133/700/700','https://picsum.photos/id/145/700/700',
      'https://picsum.photos/id/152/700/700','https://picsum.photos/id/164/700/700',
      'https://picsum.photos/id/177/700/700','https://picsum.photos/id/183/700/700',
      'https://picsum.photos/id/190/700/700','https://picsum.photos/id/201/700/700',
      'https://picsum.photos/id/219/700/700','https://picsum.photos/id/225/700/700',
      'https://picsum.photos/id/237/700/700','https://picsum.photos/id/244/700/700'
    ];

    // THREE.JS SETUP
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.16);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5.5;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // luce fioca da "torcia" che pulsa, tipico horror-dungeon
    const ambient = new THREE.AmbientLight(0x220a0a, 0.55);
    scene.add(ambient);

    const torch = new THREE.PointLight(0xff3d1a, 2.2, 12, 2);
    torch.position.set(2, 1.5, 3);
    scene.add(torch);

    const rim = new THREE.PointLight(0x2a0033, 1.1, 14, 2);
    rim.position.set(-3, -2, -2);
    scene.add(rim);

    // costruisce una texture da una FOTO REALE, con vignettatura (bordi -> trasparenti,
    // per fondere lo spigolo col nero) + leggero glitch/aberrazione cromatica
    function buildFaceTexture(url, seed) {
      return new Promise((resolve) => {
        const size = 512;
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          // cover-fit
          const scale = Math.max(size / img.width, size / img.height);
          const w = img.width * scale, h = img.height * scale;
          const x = (size - w) / 2, y = (size - h) / 2;

          // strato base: bianco e nero totale, basso contrasto per un che di "spento"
          ctx.filter = 'grayscale(100%) contrast(120%) brightness(0.75)';
          ctx.drawImage(img, x, y, w, h);
          ctx.filter = 'none';

          // aberrazione cromatica leggera (solo per il glitch, non tinge l'immagine a riposo)
          ctx.globalCompositeOperation = 'screen';
          ctx.globalAlpha = 0.10;
          ctx.drawImage(img, x - 4, y, w, h);
          ctx.globalAlpha = 0.07;
          ctx.drawImage(img, x + 4, y, w, h);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';

          // scanline sottili
          ctx.globalAlpha = 0.05;
          ctx.fillStyle = '#000';
          for (let i = 0; i < size; i += 3) ctx.fillRect(0, i, size, 1);
          ctx.globalAlpha = 1;

          // VIGNETTATURA -> alfa: il centro resta visibile, i bordi diventano trasparenti.
          // Fondendosi col nero di sfondo, lo spigolo triangolare "scompare": effetto eterei,
          // spigoli morbidi anziché taglienti.
          const grad = ctx.createRadialGradient(size/2, size/2, size*0.05, size/2, size/2, size*0.62);
          grad.addColorStop(0, 'rgba(255,255,255,1)');
          grad.addColorStop(0.65, 'rgba(255,255,255,0.85)');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.globalCompositeOperation = 'destination-in';
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, size, size);
          ctx.globalCompositeOperation = 'source-over';

          const tex = new THREE.CanvasTexture(c);
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.RepeatWrapping;
          tex.needsUpdate = true;
          resolve(tex);
        };
        img.onerror = () => {
          // fallback: rettangolo scuro se l'immagine non carica
          ctx.fillStyle = '#0a0a0a';
          ctx.fillRect(0, 0, size, size);
          resolve(new THREE.CanvasTexture(c));
        };
        img.src = url;
      });
    }

    const geometry = new THREE.IcosahedronGeometry(1.8, 0);
    const faceCount = geometry.attributes.position.count / 3; // 20 facce, geometria non indicizzata

    geometry.clearGroups();
    const materials = [];
    for (let i = 0; i < faceCount; i++) {
      geometry.addGroup(i * 3, 3, i);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.4,
        roughness: 0.9,
        metalness: 0.05,
        emissive: 0x1a0505,
        emissiveIntensity: 0.25,
        depthWrite: false
      });
      mat.userData.baseOpacity = 0.4;
      mat.userData.baseEmissive = 0.25;
      materials.push(mat);

      buildFaceTexture(facePool[i % facePool.length], i).then(tex => {
        mat.map = tex;
        mat.needsUpdate = true;
      });
    }

    const icosahedron = new THREE.Mesh(geometry, materials);
    scene.add(icosahedron);

    // ROTAZIONE HOVER CON INERZIA
    let isHovered = false;
    let velocityX = 0, velocityY = 0;
    let previousMouseX = 0, previousMouseY = 0;

    // faccia attualmente sotto il mouse (null se nessuna / mouse fuori dal solido)
    let currentHoverFace = null;
    // valore corrente di "glow" per ogni faccia: sale quando entra in hover,
    // scende quando esce o cambia faccia. Ogni faccia ha la propria coda
    // indipendente, quindi più sfumature possono sovrapporsi nel tempo.
    const faceGlow = new Array(faceCount).fill(0);
    const RISE_RATE = 10.0;  // attacco rapido
    const FALL_RATE = 2.2;   // coda più lenta, "gaussiana"

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(icosahedron);

      if (intersects.length > 0) {
        currentHoverFace = intersects[0].faceIndex;

        if (!isHovered) {
          isHovered = true;
          previousMouseX = e.clientX;
          previousMouseY = e.clientY;
        } else {
          const deltaX = e.clientX - previousMouseX;
          const deltaY = e.clientY - previousMouseY;
          velocityY = deltaX * 0.004;
          velocityX = deltaY * 0.004;
          previousMouseX = e.clientX;
          previousMouseY = e.clientY;
        }
      } else {
        isHovered = false;
        currentHoverFace = null; // esce dal solido -> tutte le facce iniziano a scendere
      }
    });

    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(icosahedron);

      if (intersects.length > 0) {
        const faceIndex = intersects[0].faceIndex;
        const projectIndex = faceIndex % projects.length;

        canvas.classList.add('morphing');
        setTimeout(() => openProject(projectIndex), 700);
      }
    });

    // GLITCH: sfarfallio rapido e convulso, tipo battito d'ali di mosca.
    // Cicli brevissimi e irregolari, più facce coinvolte insieme, escursioni forti.
    let glitchClock = 0;
    let nextGlitchAt = 0.02;
    // stato di jitter "residuo" per faccia, decade velocemente da solo
    const glitchJitter = new Array(faceCount).fill(0);

    function applyGlitch(dt) {
      glitchClock += dt;
      if (glitchClock < nextGlitchAt) return;
      glitchClock = 0;
      // intervallo prossimo battito: molto corto e irregolare (18-55ms)
      nextGlitchAt = 0.018 + Math.random() * 0.037;

      // ogni battito colpisce diverse facce contemporaneamente, in modo brusco
      const glitchCount = 2 + Math.floor(Math.random() * 4);
      for (let g = 0; g < glitchCount; g++) {
        const idx = Math.floor(Math.random() * faceCount);
        glitchJitter[idx] = 1;
        const mat = materials[idx];
        if (mat.map) {
          mat.map.offset.set((Math.random() - 0.5) * 0.14, (Math.random() - 0.5) * 0.14);
        }
      }
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.elapsedTime;

      if (isHovered) {
        icosahedron.rotation.y += velocityY;
        icosahedron.rotation.x += velocityX;
      } else {
        velocityY *= 0.95;
        velocityX *= 0.95;
        icosahedron.rotation.y += velocityY + 0.004;
        icosahedron.rotation.x += velocityX + 0.002;
      }

      // torcia che pulsa/tremola, come una fiamma in un dungeon
      torch.intensity = 1.9 + Math.sin(t * 6.0) * 0.35 + Math.sin(t * 17.0) * 0.15 + (Math.random() - 0.5) * 0.2;
      torch.position.x = 2 + Math.sin(t * 0.6) * 0.4;
      torch.position.y = 1.5 + Math.cos(t * 0.5) * 0.3;

      applyGlitch(dt);

      // inviluppo glow per-faccia: sale in fretta sulla faccia in hover,
      // scende più lentamente su tutte le altre (code che possono sovrapporsi)
      for (let i = 0; i < faceCount; i++) {
        const target = (currentHoverFace === i) ? 1 : 0;
        const rate = target > faceGlow[i] ? RISE_RATE : FALL_RATE;
        faceGlow[i] += (target - faceGlow[i]) * Math.min(1, rate * dt);

        // il jitter del glitch decade molto rapidamente da solo (battito breve)
        glitchJitter[i] *= Math.max(0, 1 - dt * 14);

        const mat = materials[i];
        if (!mat) continue;

        // sfumatura gaussiana della selezione: opacità ed emissive salgono/scendono
        // in modo smorzato invece che a scatti
        const glow = faceGlow[i];
        mat.opacity = mat.userData.baseOpacity + glow * 0.5 + glitchJitter[i] * 0.25;
        mat.emissiveIntensity = mat.userData.baseEmissive + glow * 2.2 + glitchJitter[i] * 1.6;
        mat.emissive.setRGB(
          0.10 + glow * 0.55 + glitchJitter[i] * 0.3,
          0.02 + glow * 0.18,
          0.02 + glow * 0.10
        );

        if (mat.map && glitchJitter[i] < 0.02) {
          mat.map.offset.set(0, 0);
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // APERTURA / CHIUSURA STAGE
    const projectStage = document.getElementById('projectStage');
    const imageLayer = document.getElementById('imageLayer');
    const redText = document.getElementById('redText');

    function openProject(index) {
      const proj = projects[index];
      imageLayer.innerHTML = '';
      proj.images.forEach(url => {
        const block = document.createElement('div');
        block.className = 'image-block';
        const img = document.createElement('img');
        img.src = url;
        block.appendChild(img);
        imageLayer.appendChild(block);
      });
      redText.innerText = proj.text;
      projectStage.classList.add('active');
    }

    function closeProject() {
      projectStage.classList.remove('active');
      setTimeout(() => canvas.classList.remove('morphing'), 400);
    }
  </script>
</body>
</html>
