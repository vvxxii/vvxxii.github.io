<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #webgl-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 10;
      cursor: crosshair;
      filter: contrast(120%) brightness(0.92) saturate(85%);
      transition: transform 0.9s cubic-bezier(0.7,0,0.3,1), opacity 0.8s ease, filter 0.8s ease;
    }

    #webgl-canvas.morphing {
      transform: scale(4.5);
      filter: blur(15px) contrast(200%);
      opacity: 0;
      pointer-events: none;
    }

    #vignette {
      position: fixed; inset: 0;
      z-index: 20;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.96) 100%);
      mix-blend-mode: multiply;
    }

    #grain {
      position: fixed; inset: 0;
      z-index: 21;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      animation: grainShift 0.4s steps(2) infinite;
    }
    @keyframes grainShift {
      0% { transform: translate(0,0); }
      50% { transform: translate(-2%,1%); }
      100% { transform: translate(1%,-2%); }
    }

    .project-stage {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.3s;
      background: #000;
    }
    .project-stage.active { opacity: 1; pointer-events: auto; }

    .image-scroll-layer {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 1;
    }
    .image-scroll-layer::-webkit-scrollbar { display: none; }

    .image-block { width: 100vw; height: 100vh; position: relative; }

    .image-block img {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.5) contrast(140%) grayscale(70%) sepia(20%);
      opacity: 0.88;
    }

    .image-block::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
    }

    .text-scroll-layer {
      position: absolute; top: 0; right: 10vw;
      width: 200px; height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 2;
      padding-top: 2.5rem;
      padding-bottom: 20vh;
      pointer-events: auto;
    }
    .text-scroll-layer::-webkit-scrollbar { display: none; }

    .red-text-content {
      color: #b80000;
      font-size: 0.58rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: justify;
      background: transparent;
      text-shadow: 0 0 6px rgba(184,0,0,0.35);
    }

    .close-btn {
      position: fixed; top: 2.5rem; left: 3rem;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem; line-height: 1;
      cursor: pointer; z-index: 100;
      background: transparent; border: none;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .close-btn:hover { color: #b80000; transform: scale(1.2); }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>

  <div class="project-stage" id="projectStage">
    <button class="close-btn" onclick="closeProject()">✕</button>
    <div class="image-scroll-layer" id="imageLayer"></div>
    <div class="text-scroll-layer" id="textLayer">
      <div class="red-text-content" id="redText"></div>
    </div>
  </div>

  <script>
    const projects = [
      {
        id: "PROJECT_01",
        text: "REGISTRO DI DECOMPOSIZIONE ESTETICA // Scomposizione organica della materia luminosa. La carne e l'acciaio convergono in un unico punto focale. Nessuna presenza umana rilevata oltre la soglia del silenzio. Architettura priva di gravità apparente, fondata su principi di contrazione ed espansione volumetrica. Ogni sezione fotografica costituisce un reperto esumato da strati geologici sotterranei. Frequenze visive ridotte ai minimi termini per stimolare una percezione pura, viscerale, priva di interferenze esterne. L'oscurità non è assenza di luce, ma presenza densa di materia non riflettente.",
        images: [
          'https://picsum.photos/id/1025/1600/1000',
          'https://picsum.photos/id/1040/1600/1000',
          'https://picsum.photos/id/1062/1600/1000',
          'https://picsum.photos/id/1069/1600/1000'
        ]
      },
      {
        id: "PROJECT_02",
        text: "SPAZIO GEOLOGICO CORRETTO // Infiltrazione di frequenze scure su superfici architettoniche monolitiche. Nessun segnale di ritorno. L'occhio osserva la struttura priva di massa. Sequenze d'ombra calcolate secondo algoritmi di rifrazione minerale. Il corpo reattivo si adatta all'ambiente ostile tramite una serie di trasformazioni anatomiche temporanee.",
        images: [
          'https://picsum.photos/id/1050/1600/1000',
          'https://picsum.photos/id/1060/1600/1000'
        ]
      }
    ];

    const facePool = [
      'https://picsum.photos/id/1025/700/700','https://picsum.photos/id/1040/700/700',
      'https://picsum.photos/id/1062/700/700','https://picsum.photos/id/1069/700/700',
      'https://picsum.photos/id/1050/700/700','https://picsum.photos/id/1060/700/700',
      'https://picsum.photos/id/110/700/700','https://picsum.photos/id/122/700/700',
      'https://picsum.photos/id/133/700/700','https://picsum.photos/id/145/700/700',
      'https://picsum.photos/id/152/700/700','https://picsum.photos/id/164/700/700',
      'https://picsum.photos/id/177/700/700','https://picsum.photos/id/183/700/700',
      'https://picsum.photos/id/190/700/700','https://picsum.photos/id/201/700/700',
      'https://picsum.photos/id/219/700/700','https://picsum.photos/id/225/700/700',
      'https://picsum.photos/id/237/700/700','https://picsum.photos/id/244/700/700'
    ];

    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.16);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5.5;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const ambient = new THREE.AmbientLight(0x220a0a, 0.55);
    scene.add(ambient);

    const torch = new THREE.PointLight(0xff3d1a, 2.2, 12, 2);
    torch.position.set(2, 1.5, 3);
    scene.add(torch);

    const rim = new THREE.PointLight(0x2a0033, 1.1, 14, 2);
    rim.position.set(-3, -2, -2);
    scene.add(rim);

    function buildFaceTexture(url, seed) {
      return new Promise((resolve) => {
        const size = 512;
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          // Riduzione proporzionale dell'immagine disegnata dentro la faccia
          const drawSize = size * 0.65;
          const offset = (size - drawSize) / 2;

          ctx.filter = 'grayscale(55%) contrast(130%) brightness(0.55)';
          ctx.drawImage(img, offset, offset, drawSize, drawSize);
          ctx.filter = 'none';

          ctx.globalCompositeOperation = 'screen';
          ctx.globalAlpha = 0.18;
          ctx.drawImage(img, offset - 3, offset, drawSize, drawSize);
          ctx.globalAlpha = 0.12;
          ctx.drawImage(img, offset + 3, offset, drawSize, drawSize);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';

          ctx.globalAlpha = 0.06;
          ctx.fillStyle = '#000';
          for (let i = 0; i < size; i += 3) ctx.fillRect(0, i, size, 1);
          ctx.globalAlpha = 1;

          ctx.globalCompositeOperation = 'multiply';
          ctx.fillStyle = 'rgba(90,15,15,0.35)';
          ctx.fillRect(0, 0, size, size);
          ctx.globalCompositeOperation = 'source-over';

          const grad = ctx.createRadialGradient(size/2, size/2, size*0.05, size/2, size/2, size*0.55);
          grad.addColorStop(0, 'rgba(255,255,255,1)');
          grad.addColorStop(0.6, 'rgba(255,255,255,0.85)');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.globalCompositeOperation = 'destination-in';
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, size, size);
          ctx.globalCompositeOperation = 'source-over';

          const tex = new THREE.CanvasTexture(c);
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.RepeatWrapping;
          // Riduzione aggiuntiva della texture e centratura
          tex.repeat.set(1.8, 1.8);
          tex.offset.set(-0.4, -0.4);
          tex.needsUpdate = true;
          resolve(tex);
        };
        img.onerror = () => {
          ctx.fillStyle = '#0a0a0a';
          ctx.fillRect(0, 0, size, size);
          resolve(new THREE.CanvasTexture(c));
        };
        img.src = url;
      });
    }

    const geometry = new THREE.IcosahedronGeometry(1.8, 0);
    const faceCount = geometry.attributes.position.count / 3;

    geometry.clearGroups();
    const materials = [];
    for (let i = 0; i < faceCount; i++) {
      geometry.addGroup(i * 3, 3, i);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.9,
        roughness: 0.85,
        metalness: 0.1,
        emissive: 0x1a0505,
        emissiveIntensity: 0.4,
        depthWrite: true
      });
      materials.push(mat);

      buildFaceTexture(facePool[i % facePool.length], i).then(tex => {
        mat.map = tex;
        mat.needsUpdate = true;
      });
    }

    const icosahedron = new THREE.Mesh(geometry, materials);
    scene.add(icosahedron);

    // ROTAZIONE HOVER - MOVIMENTI MINIMI E RAPIDI
    let isHovered = false;
    let velocityX = 0, velocityY = 0;
    let previousMouseX = 0, previousMouseY = 0;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(icosahedron);

      if (intersects.length > 0) {
        if (!isHovered) {
          isHovered = true;
          previousMouseX = e.clientX;
          previousMouseY = e.clientY;
        } else {
          const deltaX = e.clientX - previousMouseX;
          const deltaY = e.clientY - previousMouseY;
          // Impulso più marcato ma reattivo
          velocityY = deltaX * 0.009;
          velocityX = deltaY * 0.009;
          previousMouseX = e.clientX;
          previousMouseY = e.clientY;
        }
      } else {
        isHovered = false;
      }
    });

    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(icosahedron);

      if (intersects.length > 0) {
        const faceIndex = intersects[0].faceIndex;
        const projectIndex = faceIndex % projects.length;

        canvas.classList.add('morphing');
        setTimeout(() => openProject(projectIndex), 700);
      }
    });

    let glitchClock = 0;
    function applyGlitch(dt) {
      glitchClock += dt;
      if (glitchClock < 0.12) return;
      glitchClock = 0;

      materials.forEach((mat) => {
        mat.opacity = 0.9;
        mat.emissiveIntensity = 0.4;
        if (mat.map) { mat.map.offset.set(-0.4, -0.4); }
      });

      const glitchCount = 1 + Math.floor(Math.random() * 2);
      for (let g = 0; g < glitchCount; g++) {
        const idx = Math.floor(Math.random() * materials.length);
        const mat = materials[idx];
        mat.opacity = 0.35 + Math.random() * 0.4;
        mat.emissiveIntensity = 0.8 + Math.random() * 1.4;
        if (mat.map) {
          mat.map.offset.set(-0.4 + (Math.random() - 0.5) * 0.06, -0.4 + (Math.random() - 0.5) * 0.06);
        }
      }
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.elapsedTime;

      if (isHovered) {
        icosahedron.rotation.y += velocityY;
        icosahedron.rotation.x += velocityX;
      } else {
        // Inerzia più rapida a smorzarsi (0.88) per fermare il movimento subito
        velocityY *= 0.88;
        velocityX *= 0.88;
        icosahedron.rotation.y += velocityY + 0.005;
        icosahedron.rotation.x += velocityX + 0.003;
      }

      torch.intensity = 1.9 + Math.sin(t * 6.0) * 0.35 + Math.sin(t * 17.0) * 0.15 + (Math.random() - 0.5) * 0.2;
      torch.position.x = 2 + Math.sin(t * 0.6) * 0.4;
      torch.position.y = 1.5 + Math.cos(t * 0.5) * 0.3;

      applyGlitch(dt);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const projectStage = document.getElementById('projectStage');
    const imageLayer = document.getElementById('imageLayer');
    const redText = document.getElementById('redText');

    function openProject(index) {
      const proj = projects[index];
      imageLayer.innerHTML = '';
      proj.images.forEach(url => {
        const block = document.createElement('div');
        block.className = 'image-block';
        const img = document.createElement('img');
        img.src = url;
        block.appendChild(img);
        imageLayer.appendChild(block);
      });
      redText.innerText = proj.text;
      projectStage.classList.add('active');
    }

    function closeProject() {
      projectStage.classList.remove('active');
      setTimeout(() => canvas.classList.remove('morphing'), 400);
    }
  </script>
</body>
</html>
