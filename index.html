<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VVXXII</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000;
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: monospace;
    }

    /* Viewport a schermo intero senza limiti */
    .viewport {
      width: 100vw;
      height: 100vh;
      perspective: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: grab;
      overflow: hidden;
    }

    .viewport:active {
      cursor: grabbing;
    }

    /* Tamburo gigante che sborda dallo schermo */
    .carousel {
      width: 140px;
      height: 100vh;
      position: absolute;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, opacity 0.5s ease, filter 0.5s ease;
    }

    /* Effetto dissolvenza/glitch al click */
    .carousel.disperse {
      opacity: 0;
      filter: blur(20px) contrast(300%) grayscale(100%);
      transform: scale(1.3) translateZ(200px)!important;
      pointer-events: none;
    }

    /* Settori verticali del tamburo senza margini */
    .sector {
      position: absolute;
      width: 140px;
      height: 70vh;
      top: 15vh;
      left: 0;
      background: #000;
      backface-visibility: visible;
      /* Sfumatura ai margini laterali per glitchare un'immagine nell'altra */
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
      transition: filter 0.3s;
    }

    .sector img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(120%);
      opacity: 0.7;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .sector:hover img {
      filter: grayscale(0%) contrast(100%);
      opacity: 1;
    }

    /* Modal / Viewer a scroll verticale per serie di foto */
    .project-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none; /* Nasconde scrollbar */
    }

    .project-viewer::-webkit-scrollbar {
      display: none;
    }

    .project-viewer.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Feed verticale interno di foto */
    .photo-feed {
      max-width: 900px;
      margin: 0 auto;
      padding: 5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    .photo-feed img {
      width: 100%;
      height: auto;
      display: block;
      filter: grayscale(20%);
      border: 1px solid #111;
    }

    .close-btn {
      position: fixed;
      top: 2rem;
      right: 2rem;
      background: rgba(0,0,0,0.8);
      border: 1px solid #333;
      color: #888;
      font-family: monospace;
      padding: 0.5rem 1rem;
      cursor: pointer;
      z-index: 210;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .close-btn:hover {
      color: #fff;
      border-color: #666;
    }
  </style>
</head>
<body>

  <div class="viewport" id="viewport">
    <div class="carousel" id="carousel">
      
      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000', 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000'])">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000', 'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000'])">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1000', 'https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1000'])">
        <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000'])">
        <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1000'])">
        <img src="https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1000" alt="">
      </div>

      <div class="sector" onclick="openProject(['https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000'])">
        <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000" alt="">
      </div>

    </div>
  </div>

  <div class="project-viewer" id="viewer">
    <button class="close-btn" onclick="closeProject()">[ ESC ]</button>
    <div class="photo-feed" id="photo-feed">
      </div>
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const sectors = document.querySelectorAll('.sector');
    const totalSectors = sectors.length;
    const angleStep = 360 / totalSectors;
    
    // Calcola il raggio per far combaciare perfettamente i bordi senza spazi
    const sectorWidth = 140;
    const radius = Math.round((sectorWidth / 2) / Math.tan(Math.PI / totalSectors));

    let currentAngle = 0;
    let isDragging = false;
    let startX = 0;
    let lastAngle = 0;
    let autoRotateSpeed = 0.08; // Rotazione lenta da scanner

    // Posiziona ogni settore sul cilindro 3D
    sectors.forEach((sector, index) => {
      const angle = index * angleStep;
      sector.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
    });

    function animate() {
      if (!isDragging) {
        currentAngle += autoRotateSpeed;
        updateCarousel();
      }
      requestAnimationFrame(animate);
    }

    function updateCarousel() {
      carousel.style.transform = `translateZ(-${radius}px) rotateY(${currentAngle}deg)`;
    }

    const viewport = document.getElementById('viewport');

    // Interazioni Trascina / Touch
    viewport.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      lastAngle = currentAngle;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      currentAngle = lastAngle + deltaX * 0.3;
      updateCarousel();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    viewport.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
      lastAngle = currentAngle;
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      currentAngle = lastAngle + deltaX * 0.3;
      updateCarousel();
    });

    window.addEventListener('touchend', () => { isDragging = false; });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      currentAngle += e.deltaY * 0.08;
      updateCarousel();
    }, { passive: false });

    // Apri Progetto con animazione di dissoluzione
    function openProject(imagesArray) {
      carousel.classList.add('disperse');
      
      const feed = document.getElementById('photo-feed');
      feed.innerHTML = '';
      
      imagesArray.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        feed.appendChild(img);
      });

      setTimeout(() => {
        document.getElementById('viewer').classList.add('active');
      }, 400);
    }

    function closeProject() {
      document.getElementById('viewer').classList.remove('active');
      setTimeout(() => {
        carousel.classList.remove('disperse');
      }, 300);
    }

    animate();
  </script>
</body>
</html>
