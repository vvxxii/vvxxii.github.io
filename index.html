<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVXXII</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #888;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* VIEWPORT POLIEDRO 3D */
    .polyhedron-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      z-index: 10;
      transition: opacity 0.8s ease, filter 0.8s ease;
    }

    .polyhedron-stage.hidden {
      opacity: 0;
      filter: blur(20px) contrast(300%);
      pointer-events: none;
    }

    .polyhedron {
      width: 260px;
      height: 260px;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .face {
      position: absolute;
      width: 260px;
      height: 260px;
      background: #050505;
      border: 1px solid #222;
      overflow: hidden;
      opacity: 0.85;
      transition: border-color 0.3s, opacity 0.3s;
      backface-visibility: visible;
    }

    .face:hover {
      border-color: #888;
      opacity: 1;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(140%) brightness(0.7);
      pointer-events: none;
    }

    /* VISTA PROGETTO APERTO */
    .project-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .project-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* SCROLL IMMAGINI (SOTTO) */
    .image-scroll-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 1;
    }

    .image-scroll-layer::-webkit-scrollbar { display: none; }

    .image-block {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .image-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.75) contrast(120%);
    }

    /* SCROLL TESTO (SOPRA - IN ROSSO) */
    .text-scroll-layer {
      position: absolute;
      top: 0;
      left: 8vw;
      width: 38vw;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: none;
      z-index: 2;
      padding: 35vh 0;
      pointer-events: auto;
    }

    .text-scroll-layer::-webkit-scrollbar { display: none; }

    .red-text-content {
      color: #b30000;
      font-size: 0.85rem;
      line-height: 1.9;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(179, 0, 0, 0.4);
      /* Nessuno sfondo */
      background: transparent;
    }

    /* PULSANTE CHIUSURA / RETRATTICO */
    .close-btn {
      position: fixed;
      top: 2rem;
      right: 2rem;
      color: #555;
      font-size: 0.7rem;
      letter-spacing: 3px;
      cursor: pointer;
      z-index: 100;
      background: transparent;
      border: none;
      text-transform: uppercase;
    }

    .close-btn:hover {
      color: #b30000;
    }
  </style>
</head>
<body>

  <div class="polyhedron-stage" id="polyStage">
    <div class="polyhedron" id="polyhedron">
      
      <div class="face" style="transform: rotateY(0deg) translateZ(130px);" onclick="openProject(0)">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000" alt="">
      </div>
      <div class="face" style="transform: rotateY(90deg) translateZ(130px);" onclick="openProject(1)">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000" alt="">
      </div>
      <div class="face" style="transform: rotateY(180deg) translateZ(130px);" onclick="openProject(2)">
        <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1000" alt="">
      </div>
      <div class="face" style="transform: rotateY(-90deg) translateZ(130px);" onclick="openProject(3)">
        <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1000" alt="">
      </div>
      <div class="face" style="transform: rotateX(90deg) translateZ(130px);" onclick="openProject(0)">
        <img src="https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1000" alt="">
      </div>
      <div class="face" style="transform: rotateX(-90deg) translateZ(130px);" onclick="openProject(1)">
        <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000" alt="">
      </div>

    </div>
  </div>

  <div class="project-stage" id="projectStage">
    <button class="close-btn" onclick="closeProject()">[ REGRESS ]</button>

    <div class="text-scroll-layer" id="textLayer">
      <div class="red-text-content" id="redText"></div>
    </div>

    <div class="image-scroll-layer" id="imageLayer"></div>
  </div>

  <script>
    // ARCHIVIO PROGETTI
    const projects = [
      {
        text: "Scomposizione organica della materia luminosa. La carne e l'acciaio convergono in un unico punto focale. Nessuna presenza umana rilevata oltre la soglia del silenzio. Registro di decomposizione estetica.",
        images: [
          'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600',
          'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1600',
          'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1600'
        ]
      },
      {
        text: "Spazio geologico corretto. Infiltrazione di frequenze scure su superfici architettoniche monolitiche. Nessun segnale di ritorno. L'occhio osserva la struttura priva di massa.",
        images: [
          'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600',
          'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1600'
        ]
      },
      {
        text: "Rumore chimico su pellicola arida. Esperimento di saturazione e desaturazione viscerale. Sequenza di fotogrammi rimasti sepolti.",
        images: [
          'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1600',
          'https://images.unsplash.com/photo-1500462828032-a3a826451e51?q=80&w=1600'
        ]
      },
      {
        text: "Traccia residuale. Studio di un interno vuoto sotto illuminazione fredda isolata.",
        images: [
          'https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=1600',
          'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600'
        ]
      }
    ];

    // ROTAZIONE CASUALE DEL POLIEDRO
    const poly = document.getElementById('polyhedron');
    let rotX = 0;
    let rotY = 0;
    let rotZ = 0;

    let speedX = (Math.random() - 0.5) * 0.4;
    let speedY = (Math.random() - 0.5) * 0.4;
    let speedZ = (Math.random() - 0.5) * 0.2;

    function animatePolyhedron() {
      rotX += speedX;
      rotY += speedY;
      rotZ += speedZ;

      // Modifica impercettibilmente la traiettoria per creare un movimento organico/randomico
      if (Math.random() < 0.01) {
        speedX += (Math.random() - 0.5) * 0.05;
        speedY += (Math.random() - 0.5) * 0.05;
      }

      poly.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg)`;
      requestAnimationFrame(animatePolyhedron);
    }

    animatePolyhedron();

    // APERTURA ED ESPLORAZIONE PROGETTI
    const polyStage = document.getElementById('polyStage');
    const projectStage = document.getElementById('projectStage');
    const imageLayer = document.getElementById('imageLayer');
    const redText = document.getElementById('redText');

    function openProject(index) {
      const proj = projects[index];

      // Svuota e riempie lo scroll immagini
      imageLayer.innerHTML = '';
      proj.images.forEach(url => {
        const block = document.createElement('div');
        block.className = 'image-block';
        const img = document.createElement('img');
        img.src = url;
        block.appendChild(img);
        imageLayer.appendChild(block);
      });

      // Inserisce il testo rosso
      redText.innerText = proj.text;

      // Transizione di stato
      polyStage.classList.add('hidden');
      setTimeout(() => {
        projectStage.classList.add('active');
      }, 400);
    }

    function closeProject() {
      projectStage.classList.remove('active');
      setTimeout(() => {
        polyStage.classList.remove('hidden');
      }, 300);
    }
  </script>
</body>
</html>
